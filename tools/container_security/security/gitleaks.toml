# container_security 用 gitleaks 設定。
# ビルド成果物・一時レポートを除外し、target/ 走査による実質ハングを防ぐ。
title = "veil container_security gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Build artifacts, caches, generated reports, and triaged false positives"
paths = [
  '''(^|/)target/''',
  '''(^|/)tools/container_security/results/''',
  '''(^|/)tools/container_security/harness/tools/target/''',
  '''(^|/)docs/artifacts/''',
  '''(^|/)\.git/''',
  '''\.rmeta$''',
  '''\.rlib$''',
  # --- トリアージ済み誤検知（2026-08-17）---
  # テスト・開発用の自己署名証明書。E2E / perf ハーネス / コンテナイメージが
  # 使う使い捨ての鍵で、本番の秘密情報ではない（いずれも CN=localhost もしくは
  # "rcgen self signed cert" の自己署名。openssl x509 で確認済み）。
  # これらは意図的にリポジトリへコミットされている（テストを自己完結させるため）。
  '''(^|/)tests/fixtures/key\.pem$''',
  '''(^|/)docker/assets/ssl/key\.pem$''',
  '''(^|/)credential/ssl/key\.pem$''',
  # ドキュメント中の例示値のみ（JWT フィルタの設定例と curl の実行例）。
  # "dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIEhTMjU2" は "this is a secret key for HS256"
  # の base64 で、読者に形式を示すためのプレースホルダ。
  '''(^|/)examples/wasm-filters/jwt-filter/README\.md$''',
  # --- トリアージ済み誤検知（2026-10-18、v0.8.0）---
  # Istio の security/tools/jwt/samples の公開サンプル（groups-scope.jwt と同じトークン）。メッシュの
  # JWT 検証の単体試験と kind の E2E が使う。鍵は Istio のリポジトリで公開されている試験用。
  '''(^|/)tools/k8s/testdata/[^/]+\.jwt$''',
  # 計測・試験の作業ディレクトリ（git 管理外。生成した自己署名の鍵・クロスビルドの依存のソース）と
  # エージェントの作業ツリー（.claude/worktrees は本リポジトリの複製）
  '''(^|/)tools/perf/results/''',
  '''(^|/)\.claude/''',
]
regexes = [
  # --- トリアージ済み誤検知（2026-08-17）---
  # RFC 6455 Section 1.3 に記載された **仕様書そのものの例値**（"the sample nonce"
  # の base64）。WebSocket ハンドシェイクのテスト・プローブで多数使っている。
  # generic-api-key ルールが base64 文字列として拾うが秘密情報ではない。
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # 上の Istio のサンプルトークン（src/mesh/jwt.rs の単体試験に埋め込んである）の署名部の先頭
  '''EdJnEZSH6X8hcyEii7c8H5lnhgjB5dwo07M5oheC8Xz8mOllyg''',
  # kind の E2E（tools/k8s/mesh-e2e.sh）で WasmPlugin の basic_auth に渡す試験用の資格情報
  '''^ok:(test|wrong)$''',
  # --- トリアージ済み誤検知（2026-10-27、v0.10.0。B-217）---
  # library_e2e.sh の Basic 認証の試験（veil-proxy-kit の例の固定の資格情報）
  '''^admin:pw$''',
  # Python の ASGI の文書の引数名（`forwarded_allow_ips="10.0.0.1"`）。値は IP アドレス
  '''^forwarded_allow_ips=$''',
]
