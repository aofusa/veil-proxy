[server]
listen = "0.0.0.0:443"
listen_cleartext = "0.0.0.0:8080"
enable_secure_redirect = false
http2_enabled = true
threads = 0

[logging]
level = "warn"

[security]
allow_security_failures = false
drop_privileges_user = "nonroot"
drop_privileges_group = "nonroot"
enable_seccomp = true
enable_landlock = true
enable_sandbox = false
seccomp_mode = "filter"
landlock_read_paths = ["/var/www", "/var/cache/veil", "/var/tmp/veil", "/etc/veil", "/etc/resolv.conf", "/etc/hosts", "/etc/nsswitch.conf", "/lib", "/lib64", "/usr"]
landlock_write_paths = ["/var/cache/veil", "/var/tmp/veil"]

[performance]
huge_pages_enabled = false
reuseport_balancing = "kernel"

[tls]
cert_path = "/etc/veil/ssl/cert.pem"
key_path = "/etc/veil/ssl/key.pem"
ktls_enabled = false
ktls_fallback_enabled = true

[static_file_cache]
enabled = true
valid_duration_secs = 60
max_entries = 1024
max_file_size_bytes = 1048576

[[route]]
[route.conditions]
path = "/"
[route.action]
type = "File"
path = "/var/www/"
[route.security]
allowed_methods = ["HEAD", "GET"]
[route.open_file_cache]
enabled = true
valid_duration_secs = 60
max_entries = 1024

[prometheus]
enabled = true
path = "/__metrics"
allowed_ips = []
