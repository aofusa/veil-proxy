worker_processes auto;
events { worker_connections 8192; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 計測の公平化のためアクセスログは無効（Veil も logging.level=warn で抑止）
    access_log off;
    error_log  /dev/stderr warn;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    keepalive_requests 100000;

    server {
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        add_header Alt-Svc 'h3=":443"; ma=86400';
        server_name _;
        ssl_certificate     /etc/veil/ssl/cert.pem;
        ssl_certificate_key /etc/veil/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /var/www;
        location / {
            index index.html;
        }
    }
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    upstream perf_backend { server perf-backend:80; keepalive 128; }

    # 逆プロキシの同条件の相手（veil の *_proxy* 構成。base_proxy）: TLS で受けて perf-backend の平文 HTTP/1.1 へ中継
    server {
        listen 8443 ssl;
        listen 8443 quic reuseport;
        http2 on;
        server_name _;
        ssl_certificate     /etc/veil/ssl/cert.pem;
        ssl_certificate_key /etc/veil/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://perf_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # 中継 + 圧縮の同条件の相手（veil の *_proxy_compression 構成。base_proxy_compression）: 中継の応答を gzip で圧縮
    server {
        listen 8445 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/veil/ssl/cert.pem;
        ssl_certificate_key /etc/veil/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        gzip on;
        gzip_proxied any;
        gzip_types text/plain text/css application/javascript application/json;
        gzip_min_length 0;
        location / {
            proxy_pass http://perf_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # 圧縮の同条件の相手（veil のキャッシュ無しの *_compression 構成。base_compression）: 要求ごとに gzip で圧縮
    # （nginx:alpine に brotli・zstd は無い。gzip_comp_level は既定の 1）
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/veil/ssl/cert.pem;
        ssl_certificate_key /etc/veil/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        gzip on;
        gzip_types text/plain text/css application/javascript application/json;
        gzip_min_length 0;
        root /var/www;
        location / {
            index index.html;
        }
    }

    # h2c（平文 HTTP/2 prior knowledge）。veil の平文リスナー（listen_cleartext）に
    # 対し、比較対象の nginx も h2c を有効にしないと条件が揃わない（tools/perf/freebsd/run_perf_freebsd.sh の先例）。
    server {
        listen 8080;
        http2 on;
        server_name _;
        # veil の h2c 構成が静的コンテンツキャッシュ + open_file_cache を有効に
        # しているため（F-157）、nginx 側も同等の open_file_cache を入れて
        # 「双方とも静的配信の推奨設定を入れた状態」で比較する。
        # 443/80 の既存ブロックには影響させない（過去の計測値との比較を保つため
        # ここ（h2c 用サーバブロック）に閉じて設定する）。
        open_file_cache max=1024 inactive=60s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;
        root /var/www;
        location / {
            index index.html;
        }
        location /proxy/ {
            proxy_pass http://perf_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
