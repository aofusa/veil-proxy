worker_processes auto;
events { worker_connections 8192; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 計測の公平化のためアクセスログは無効（Veil も logging.level=warn で抑止）
    access_log off;
    error_log  /dev/stderr warn;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    keepalive_requests 100000;

    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/veil/ssl/cert.pem;
        ssl_certificate_key /etc/veil/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /var/www;
        location / {
            index index.html;
        }
    }
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    upstream perf_backend { server perf-backend:80; keepalive 128; }

    # h2c（平文 HTTP/2 prior knowledge）。veil の平文リスナー（h2c_listen）は
    # h2c 専用で HTTP/1.1 を受け付けないため、比較対象の nginx も h2c を
    # 有効にしないと条件が揃わない（tools/perf/freebsd/run_perf_freebsd.sh の先例）。
    server {
        listen 8080;
        http2 on;
        server_name _;
        # veil の h2c 構成が静的コンテンツキャッシュ + open_file_cache を有効に
        # しているため（F-157）、nginx 側も同等の open_file_cache を入れて
        # 「双方とも静的配信の推奨設定を入れた状態」で比較する。
        # 443/80 の既存ブロックには影響させない（過去の計測値との比較を保つため
        # ここ（h2c 用サーバブロック）に閉じて設定する）。
        open_file_cache max=1024 inactive=60s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;
        root /var/www;
        location / {
            index index.html;
        }
        location /proxy/ {
            proxy_pass http://perf_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
