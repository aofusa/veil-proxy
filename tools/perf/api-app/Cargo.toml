# F-295: 計測用の API サーバ（HttpArena の veil-api と同じ形のハンドラ・gRPC）。本体のワークスペースへ入れない。
# A/B は同じソースを改修前の作業ツリーへ置いてビルドする（tools/perf/README.md「API 経路の交互 A/B」）。
[package]
name = "veil-api-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "veil-api-app"
path = "src/main.rs"

[dependencies]
veil = { package = "veil-proxy", path = "../../..", default-features = false, features = ["ktls", "http2", "compression", "grpc-handler", "macro", "veil-alloc"] }
prost = "0.13"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
veil-build = { package = "veil-proxy-build", path = "../../../crates/veil-build" }

[features]
# reactor（epoll）で測る: --features epoll
epoll = ["veil/epoll"]
# 確保の回数・経路を見る: veil-alloc の代わりにシステムアロケータ（--features sysalloc）
sysalloc = []

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[workspace]
