# axum + veil の tokio 互換レイヤー（依存ツリーの tokio を veil の shim に置き換える）と、
# veil の API ライブラリ（axum の Router を tokio_service で載せる・ネイティブハンドラ）。tools/api-bench/README.md を参照。
[package]
name = "api-bench-axum-veil"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
veil = { package = "veil-proxy", path = "../../..", default-features = false, features = ["http2", "api"] }
axum = { version = "0.8", features = ["http2"] }   # h2c の計測（--proto h2c）
tokio = { version = "1", features = ["full"] }   # crates/veil-tokio/tokio-shim に解決される
serde_json = "1"

[features]
# reactor（epoll）バックエンドで測る: cargo build --release --features epoll
epoll = ["veil/epoll"]
# 確保の回数を数える（allocs/req）: cargo build --release --features count-allocs
count-allocs = []
# HTTP/3 の計測（run_bench.py --proto h3）: CARGO_TARGET_DIR=target-h3 cargo build --release --features http3
http3 = ["veil/http3"]

[patch.crates-io]
tokio = { path = "../../../crates/veil-tokio/tokio-shim" }

[profile.release]
codegen-units = 1
