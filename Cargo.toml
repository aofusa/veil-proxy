[workspace]
members = [".", "fuzz"]
# resolver v2: dev-dependencies の feature を通常ビルド（`cargo build`）へ統合しない。
# これにより OpenBSD 本体ビルドがテスト用 dev-deps（hyper-rustls/quinn/tokio-rustls/rcgen
# の aws_lc_rs）に引きずられて aws-lc-sys を要求することを防ぎ、ring のみでビルドできる
# （F-122）。edition 2021 パッケージ既定と一致。
resolver = "2"

[package]
name = "veil"
version = "0.6.0"
edition = "2021"
description = "High-performance reverse proxy server using io_uring and rustls"
license = "Apache-2.0 OR MIT"
authors = ["aofusa"]
build = "build.rs"

[lib]
name = "veil"
path = "src/lib.rs"

[features]
# デフォルトビルド（kTLS + HTTP/2 + mimalloc）
default = ["ktls", "http2", "mimalloc"]

# ====================
# プロトコル系
# ====================

# kTLS（Kernel TLS）サポート
# 自前実装の ktls モジュールによる kTLS カーネルオフロードサポート
#
# 要件:
#   - Linux 5.15+ カーネル
#   - `modprobe tls` でkTLSモジュールをロード済み
#   - AES-GCM暗号スイートの使用
#
# ビルド方法: cargo build --features ktls
ktls = []

# HTTP/2 サポート
# ALPN ネゴシエーションにより HTTP/2 (h2) を使用
# kTLS と併用可能: cargo build --features "ktls,http2"
http2 = []

# HTTP/3 サポート (QUIC ベース)
# UDP/QUIC を使用した HTTP/3 プロトコル
# 注意: HTTP/3 は UDP ベースのため kTLS は使用不可
# GSO/GRO による高パフォーマンス UDP 処理
#
# ターゲット別 TLS バックエンド（build.rs が AWS_LC_SYS_NO_PREFIX を制御）:
#   - linux / freebsd : quiche (default-features=false) + 共有 aws-lc-sys (NO_PREFIX=1)
#   - windows / macos : quiche (boring) + rustls 側の aws-lc-rs (NO_PREFIX=0 で共存)
#   - openbsd         : quiche (boring) + rustls 側の ring（aws-lc-* は一切依存しない）
http3 = ["dep:quiche"]

# epoll ベースの readiness ランタイム（F-120 クロスプラットフォーム対応）
# デフォルトの io_uring 完了ベースランタイムの代わりに epoll ベースの
# reactor ランタイムを使う。Linux 専用（非 Linux では指定不要・
# 自動で kqueue ベースの reactor が選択される。build.rs 参照）。
# デフォルト機能構成は変更しない（default はこの feature を含まない）。
# ビルド方法: cargo build --features epoll
epoll = []

# FreeBSD 専用: POSIX AIO（aio_read/aio_write + EVFILT_AIO）による TCP read/write
# 完了通知ベース経路（F-127）。既定オフ。FreeBSD 以外で指定すると build.rs が panic する
# （epoll feature の非対応ターゲット扱いと同様）。既存の kqueue readiness 経路は
# このフィーチャー未指定時そのまま維持される（オプトイン、ゼロコスト）。
# ビルド方法（FreeBSD のみ）: cargo build --features aio
aio = []

# WASM Extension サポート (Proxy-Wasm v0.2.1)
# Wasmtime ランタイムによる WebAssembly フィルタ
# AOT コンパイル、Pooling Allocator、InstancePre 使用
wasm = ["dep:wasmtime"]

# gRPC サポート (HTTP/2 ベース)
# gRPC ワイヤプロトコル（framing, headers, trailers）を実装
# Protobuf 解析には prost を使用（オプション）
# ビルド方法: cargo build --features grpc
grpc = ["dep:prost"]

# gRPC-Web サポート
# ブラウザ互換の gRPC-Web プロトコル変換
# CORS 設定は config.toml でルート毎に設定可能
grpc-web = ["grpc"]

# gRPC 全機能サポート
# HTTP/3 上の gRPC は http3 feature に依存
grpc-full = ["grpc", "grpc-web", "http3"]

# ====================
# メモリアロケータ（排他的に1つを選択）
# ====================

# mimalloc 高速メモリアロケータ（デフォルト）
# Huge Pages サポート付き
# ビルド方法: cargo build --features mimalloc（デフォルトで有効）
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

# jemalloc メモリアロケータ
# mimalloc と排他的に使用（同時に有効化しないこと）
# ビルド方法: cargo build --no-default-features --features "ktls,http2,jemalloc"
jemalloc = ["dep:tikv-jemallocator"]

# システムアロケータ（明示的指定用）
# --no-default-features 時のデフォルト
# ビルド方法: cargo build --no-default-features --features system-allocator
system-allocator = []

# ====================
# 機能系（オプション）
# ====================

# レスポンス圧縮（Gzip/Brotli/Zstd）
# ビルドサイズとセキュリティサーフェスを削減したい場合はオフに
# ビルド方法: cargo build --features compression
compression = ["dep:flate2", "dep:brotli", "dep:zstd"]

# プロキシキャッシュ（インメモリ + ディスク）
# dashmap/lru/glob を使用したレスポンスキャッシュ
# ビルド方法: cargo build --features cache
cache = ["dep:dashmap", "dep:glob"]

# Prometheusメトリクス出力
# リクエスト数、レイテンシ、エラー率などを計測・エクスポート
# ビルド方法: cargo build --features metrics
metrics = ["dep:prometheus"]

# WebSocket プロキシサポート
# Upgrade ヘッダー検出による双方向プロキシ
# ビルド方法: cargo build --features websocket
websocket = []

# レートリミット・接続制限
# スライディングウィンドウ式レートリミット
# ビルド方法: cargo build --features rate-limit
rate-limit = []

# 高度なレスポンスバッファリング制御
# 低速クライアントによるバックエンド占有防止
# ビルド方法: cargo build --features buffering
buffering = []

# OpenTelemetry (OTLP/HTTP) メトリクスエクスポート（F-10 Phase 1）
# データプレーンは tokio-free のため、専用の std スレッドで
# OTLP/HTTP (JSON) を std::net::TcpStream で送信する軽量実装。
# 重い opentelemetry クレート（tokio 依存）は使用しない。
# metrics feature と併用することで Prometheus レジストリの値をブリッジする。
# ビルド方法: cargo build --features opentelemetry
opentelemetry = []

# 管理 Admin API（F-20: キャッシュ Purge、F-21: /config, /stats, /reload, /tls/reload）
# /__admin エンドポイントを有効化する。Bearer 認証 + IP 制限つき。
# キャッシュ Purge は cache feature と併用することで有効になる。
# ビルド方法: cargo build --features admin
admin = []

# 構造化アクセスログ（F-21）
# JSON / テキスト形式でリクエスト単位のアクセスログを出力する。
# スレッドローカルバッファによりヒープアロケーションを最小化。
# アプリケーションログ（[logging]）とは独立したファイルに書き込める。
# ビルド方法: cargo build --features access-log
access-log = []

# L4 (TCP/UDP) ストリームプロキシ（F-18）
# nginx stream / Envoy TCP proxy 相当の L4 レイヤープロキシ機能。
# HTTP 以外のユースケース（DB 接続、バイナリプロトコル等）をサポート。
# TLS passthrough / termination、接続数制限、LB（RR / LeastConn）を含む。
# ビルド方法: cargo build --features l4-proxy
l4-proxy = []

# システムの SSL ライブラリ（OpenSSL / LibreSSL）へ動的リンクする（F-137）。
#
# **OpenBSD 専用**（将来 NetBSD にも同じ扱いで対応予定）。Linux/FreeBSD/macOS/Windows で
# 指定すると `build.rs` がビルド開始時点で明確なエラーを出して止める
# （`SYSTEM_TLS_ALLOWED_TARGET_OSES` 参照。NetBSD 対応時はこの配列に "netbsd" を
# 1 行足すだけでよい形にしてある）。
#
# rustls の暗号プロバイダを `rustls-openssl`（システムの LibreSSL libcrypto を呼ぶ）へ
# 切り替える。rustls 本体はそのまま使い、**依存する暗号ライブラリだけ**を差し替える。
# HTTP/3（quiche）側は本 feature 単体では変更しない。`full-openbsd` が
# `quiche?/openssl`（pkg-config 経由の動的リンク）を別途明示的に追加して同じシステム
# ライブラリへ揃える。
#
# **なぜ OpenBSD 専用か**: Linux/FreeBSD は `aws-lc-rs`/`aws-lc-sys` が
# `target_os` のみで決まる無条件の依存であり、どの Cargo feature を選んでも
# 依存グラフから外れない。aws-lc-sys のビルド成果物には `AWS_LC_SYS_NO_PREFIX` の
# 値に関わらず `libssl.a`/`libcrypto.a` という**システム OpenSSL と同名の静的
# ライブラリ**が生成され、これが最終リンクコマンドの `-L` でシステムパスより先に
# 来るため、`rustls-openssl`（openssl-sys 経由）が要求する動的 `-lssl -lcrypto` が
# そちらに解決されてしまい、aws-lc-sys に無い新しめの OpenSSL 3.0 系シンボル
# （`EVP_Q_digest`/`EVP_default_properties_is_fips_enabled`/`ERR_get_error_all` 等）が
# undefined symbol になってリンクが壊れる（`http3` を完全に外した最小構成
# `--features "http2,mimalloc,system-tls"` でも再現する、quiche の feature 選択とは
# 無関係の問題であることを確認済み）。修正には aws-lc-rs/aws-lc-sys を
# `optional = true` にして system-tls と排他的に切り替える必要があるが、これは
# 「`cargo build --no-default-features`（フィーチャー無し単体）が動作し続ける」という
# 既存の受け入れ条件と両立しない（Cargo のフィーチャーは加算のみで、一方が立っていたら
# 他方を無効化するという否定的な表現ができないため）ため見送った。
# **OpenBSD のみ**、quiche/rustls の依存を aws-lc-sys 共有から完全に切り離してある
# （下の `[target.'cfg(target_os = "openbsd")'.dependencies]` 参照）ため、この衝突が
# 起きない。詳細な調査ログは `docs/backlog/features/F-137-system-tls-feature.md` の
# 「既知の限界・今後の課題」を参照。
#
# HTTP/3 証明書ホットリロードへの影響（`src/http3_server.rs`、OpenBSD限定の話）:
# `system-tls` 有効時は quiche の in-memory `SSL_CTX` API（`boringssl-boring-crate`
# 限定）が使えなくなるため、Linux と同じパス指定 API（`create_memfd_for_pem`、
# OpenBSD 版は 0600 の一時ファイル、`std::env::temp_dir()` 配下、Drop で unlink）に
# フォールバックする。unveil のビューに一時ディレクトリが必要で、
# `src/config.rs::collect_unveil_paths` が `system-tls` 有効時のみ
# `std::env::temp_dir()` を `read_write_create` に追加済み（`pledge` の
# `wpath cpath` promise は既存のまま変更不要）。`system-tls` を使わない
# `full-openbsd-vendor`（BoringSSL 同梱）は代わりに in-memory 経路（ファイル不使用、
# サンドボックス耐性がより高い）を使う。FreeBSD（`system-tls` 非対象）は
# 常に in-memory 経路のままで、capsicum capability mode 下でもホットリロードが
# 機能する（F-136 の成果は無変更）。
#
# kTLS との併用: `veil_ktls` は aws_lc_rs 固有の cipher_suite 定数を直接参照するため
# `system-tls` とは併用できない（OpenBSD は元々 kTLS 非対応なので実質関係ない）。
# `build.rs` が `ktls` + `system-tls` 同時指定時に `veil_ktls` cfg を立てず
# （kTLS を自動的に無効化し）、`cargo:warning` を出す。
#
# ビルド要件: pkg-config と libssl/libcrypto の .pc（開発パッケージ）
# ビルド方法: cargo build --no-default-features --features full-openbsd  # OpenBSD（既定）
system-tls = ["dep:rustls-openssl", "dep:openssl"]

# OpenBSD 専用の内部フォワーディング feature（F-137）: quiche の vendored BoringSSL
# バックエンド（`boringssl-boring-crate`、外部 `boring` crate 経由）を有効化する。
# `full-openbsd-vendor` / `full-openbsd-aarch64-vendor` が使用する。
#
# `system-tls` とは併用できない: quiche の build.rs は `boringssl-boring-crate` が
# 有効だと静的リンク（boring crate が cmake でビルドする BoringSSL）を、`openssl`
# feature が有効だと pkg-config 経由の動的リンクを、それぞれ独立に指示するため、
# 両方同時に有効化すると同一バイナリに BoringSSL 静的リンクとシステム libssl
# 動的リンクが混在し、目的（システムライブラリのみへ動的リンク）を満たせなくなる。
# OpenBSD 以外（FreeBSD/macOS/Windows）は従来通り target 別依存で
# `boringssl-boring-crate` を無条件有効化しており、この feature の対象外
# （`system-tls` は現状 OpenBSD packaging のみで使用する）。
openbsd-vendor-tls = ["quiche?/boringssl-boring-crate", "dep:boring"]

# ====================
# 複合フィーチャ（便利用）
# ====================

# 全機能ビルド
full = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "mimalloc",
    "admin",
    "access-log",
    "l4-proxy",
]

# BSD 向けの全機能ビルド（packaging 用）
# ---------------------------------------------------------------------------
# `full` との違いはアロケータと FreeBSD 専用の I/O 経路だけで、機能セットは同一。
# cargo にはターゲット別の default features が無いため、`full` からアロケータを
# 差し替えたセットを別 feature として用意し、packaging のビルドスクリプト
# （packaging/scripts/build-cross.sh・tools/qemu/bsd-vm.sh）が
# `--no-default-features --features full-freebsd|full-openbsd` で明示指定する。
# 通常の `--features full` は従来どおり mimalloc のままで挙動を変えない。

# FreeBSD: mimalloc の代わりに jemalloc、加えて POSIX AIO 経路（F-127）を有効化する。
full-freebsd = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "jemalloc",
    "aio",
    "admin",
    "access-log",
    "l4-proxy",
]

# OpenBSD: システムアロケータ（global_allocator を差し替えない）を使う。
# mimalloc / jemalloc とも有効化しないことでシステム malloc(3) が使われる。
# OpenBSD の wasm は **Pulley インタープリタ**で実行する（B-52）。
# wasmtime の Cranelift JIT が生成するネイティブコードは OpenBSD で動かず、
# wasm モジュールを 1 回実行しただけで veil ごと SIGSEGV するため、
# `src/wasm/registry.rs` が OpenBSD のみ `Config::target("pulley64")` を指定する。
#
# F-137: 既定の OpenBSD packaging 構成は `system-tls`（システムの LibreSSL へ
# 動的リンク）。従来の同梱（rustls+ring / quiche+BoringSSL 同梱）構成が必要な場合は
# 下の `full-openbsd-vendor` を使う。
# `quiche?/openssl` を明示的に追加している: OpenBSD の quiche 依存は
# aws-lc-sys 共有から完全に切り離してある（`system-tls` のコメント参照）ため、
# ここでのみ quiche の TLS バックエンドも動的リンクの `openssl` feature へ
# 安全に切り替えられる（Linux/FreeBSD は衝突するため `system-tls` 自体には含めない）。
# HTTP/3 証明書ホットリロードは一時ファイル経由（`std::env::temp_dir()`、unveil の
# read-write-create に追加済み、`src/config.rs::collect_unveil_paths`）で機能する。
full-openbsd = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "system-tls",
    "quiche?/openssl",
]

# OpenBSD: 従来の rustls+ring / quiche+BoringSSL 同梱構成（vendored、F-137 以前と同一内容）。
# `system-tls` の代わりに `openbsd-vendor-tls`（quiche の vendored BoringSSL、
# `boringssl-boring-crate` feature 経由）を有効化する。HTTP/3 証明書ホットリロードは
# in-memory `SSL_CTX` API（ファイル不使用、サンドボックス耐性がより高い）を使う。
full-openbsd-vendor = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "openbsd-vendor-tls",
]

# BSD の **aarch64** 向け feature セット（B-55）。
#
# `full-freebsd` / `full-openbsd` から **`wasm` だけを外した**もの。
# wasmtime 40 のシグナルベーストラップ実装
# （`src/runtime/vm/sys/unix/signals.rs`）には `(freebsd, aarch64)` /
# `(openbsd, aarch64)` の分岐が無く `compile_error!("unsupported platform")` になる。
# 有効/無効は wasmtime の build.rs が **ホストの target_arch から導出**するため
# （`has_native_signals`）、cargo feature で外すこともできない。
# したがって BSD aarch64 では wasm を含められない。x86_64 は従来どおり wasm 込み。
full-freebsd-aarch64 = [
    "ktls", "http2", "http3",
    "grpc-full",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "jemalloc",
    "aio",
    "admin",
    "access-log",
    "l4-proxy",
]

full-openbsd-aarch64 = [
    "ktls", "http2", "http3",
    "grpc-full",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "system-tls",
    "quiche?/openssl",
]

# `full-openbsd-aarch64` の従来（vendored）構成。`full-openbsd-vendor` の aarch64 版。
full-openbsd-aarch64-vendor = [
    "ktls", "http2", "http3",
    "grpc-full",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "openbsd-vendor-tls",
]

[dependencies]
# monoio 削除: カスタム io_uring 実装 (src/runtime/) に完全移行
# rustls を直接使用（ハンドシェイク後に kTLS へオフロード）。
# 暗号プロバイダは target 別に選択する（F-122、src/tls_provider.rs 参照）:
#   - 非 OpenBSD（Linux/FreeBSD）: aws_lc_rs（kTLS・quiche と AWS-LC 共有）
#   - OpenBSD: ring（aws-lc-rs は OpenBSD で TLS ハンドシェイクを完了できないため）
# provider feature は下の [target.*] で付与し、ここでは共通 feature のみ指定する。
rustls = { version = "0.23.35", default-features = false, features = ["std", "tls12", "logging"] }
webpki-roots = "1.0.4"
rustls-pki-types = "1.13.2"
libc = "0.2.178"
# mimalloc 高速メモリアロケータ（mimalloc feature で有効化）
mimalloc = { version = "0.1.48", default-features = false, optional = true }
# Huge Pages (Large OS Pages) 設定用
# mimallocの低レベルAPIを使用してLarge OS Pagesを有効化
# extendedフィーチャーでmi_option_set等のAPIを使用可能に
libmimalloc-sys = { version = "0.1.44", features = ["extended"], optional = true }
# jemalloc メモリアロケータ（jemalloc feature で有効化）
tikv-jemallocator = { version = "0.6", optional = true }
toml = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
httparse = "1.10.1"
memchr = "2.7.6"
bytes = "1.11.0"
anyhow = "1.0.100"
mime_guess = "2.0.5"
num_cpus = "1.17.0"
ftlog = "0.2.15"
time = "0.3.44"
hostname = "0.4.2"
itoa = "1.0.17"
ctrlc = "3.5.1"

# CPUアフィニティ設定
# 各ワーカースレッドを特定のCPUコアに固定し、キャッシュ効率を向上
core_affinity = "0.8.3"



# 高速ルーティング（Radix Tree）
# O(n)線形探索からO(log n)に改善
matchit = "0.9.1"

# 設定のホットリロード対応
# ロックフリーな設定更新を実現
arc-swap = "1.8.0"
once_cell = "1.21.3"
signal-hook = "0.4.1"

# Prometheusメトリクス対応（metrics feature で有効化）
# リクエスト数、レイテンシ、エラー率などを計測・エクスポート
prometheus = { version = "0.14.0", optional = true }
clap = { version = "4.5.53", features = ["derive"] }

# system-tls（F-137）: rustls の暗号プロバイダをシステム libcrypto（OpenSSL / LibreSSL）へ
# 差し替える。`vendored` feature は絶対に有効化しない（静的埋め込みになり本来の目的
# ＝システムライブラリへの動的リンクに反する）。tls12 は他プロバイダ（aws_lc_rs/ring）と
# 同じ TLS1.2 サポート範囲に揃えるため明示指定する。
rustls-openssl = { version = "0.3.1", optional = true, default-features = false, features = ["tls12"] }
# system-tls 時の HTTP/3（quiche）RNG シム用（`SecureRandom`/`SystemRandom` 相当、
# src/tls_provider.rs 参照）。
openssl = { version = "0.10", optional = true }

# HTTP/3 用 QUIC 実装（Cloudflare quiche）は末尾の target.*.dependencies で定義

# Wasmtime: WebAssembly ランタイム (Proxy-Wasm v0.2.1)
# - pooling-allocator: 高速インスタンス化
# - cranelift: AOT コンパイル
# - component-model: WASI対応
# - pulley: ポータブルバイトコードインタープリタ（`Config::target("pulleyNN")`）。
#   `[wasm] interpreter = true`（F-135）や OpenBSD（B-52、常時強制）で使用する。
wasmtime = { version = "40.0.0", optional = true, features = ["pooling-allocator", "cranelift", "pulley"] }

# Protobuf: gRPC メッセージのシリアライズ/デシリアライズ
# prost は gRPC feature 有効時のみ使用
prost = { version = "0.13", optional = true }

# ====================
# レスポンス圧縮ライブラリ（compression feature で有効化）
# ====================
# Gzip圧縮（flate2）
# - ストリーミング圧縮対応
# - 圧縮レベル1-9をサポート
flate2 = { version = "1.1.5", optional = true }

# Brotli圧縮
# - 高圧縮率（Gzipより10-20%効率的）
# - ストリーミング圧縮対応
# - 圧縮レベル0-11をサポート
brotli = { version = "8.0.2", optional = true }

# Zstandard (zstd) 圧縮
# - 高速かつ高圧縮率（Gzipより高速で高圧縮）
# - ストリーミング圧縮対応
# - 圧縮レベル1-22をサポート
zstd = { version = "0.13.3", optional = true }

# ====================
# プロキシキャッシュ・バッファリング制御
# ====================
# ロックフリー並行ハッシュマップ（キャッシュインデックス用、cache feature で有効化）
# - 高並行性アクセスに最適化
# - スレッドセーフな挿入・削除・検索
dashmap = { version = "6.1.0", optional = true }

# LRU キャッシュ（ルーティングキャッシュ・メモリキャッシュのeviction用）
# - O(1)の挿入・検索・削除
# - 最大容量制限とLRU eviction
# - ルーティングキャッシュで常に使用するため常時有効
lru = "0.16.2"

# 高速ハッシュ関数（キャッシュキー生成用）
# - xxHash3: 非常に高速なハッシュ関数
# - キャッシュキーの生成、ルーティングキャッシュ、バッファリングで使用
# - ルーティングキャッシュ等で常時使用するため常時有効
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

# glob パターンマッチング（キャッシュバイパス設定用、cache feature で有効化）
# - シンプルなワイルドカードパターン
# - 正規表現より高速
glob = { version = "0.3.3", optional = true }
rayon = "1.12.0"
futures = "0.3.31"

# ====================
# rustls 暗号プロバイダの target 別選択（F-122、src/tls_provider.rs 参照）
# ====================
# aws_lc_rs を使う target:
#   - 非 OpenBSD（Linux/FreeBSD/macOS/Windows）: kTLS（ktls_rustls）・quiche(http3) と
#     AWS-LC を共有し、アセンブリ最適化が効く。http3_server の RNG（aws_lc_rs::rand）にも使う。
#
# F-137: これらは **無条件依存のまま**にしてある。`system-tls` は OpenBSD 専用で、
# 非 OpenBSD では build.rs がエラーにするため、optional 化して排他切替する必要が無い
# （optional 化すると `cargo build --no-default-features` 単体が暗号プロバイダ不在で
# コンパイルできなくなり、既存の受け入れ条件を壊す。`system-tls` のコメント参照）。
[target.'cfg(not(target_os = "openbsd"))'.dependencies]
# default-features = false は base の [dependencies] rustls と一致させる（provider は明示指定）。
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs"] }
# bindgen: AWS_LC_SYS_NO_PREFIX 時に aws-lc-sys がバインディング生成するため必要
aws-lc-rs = { version = "1.15.2", features = ["bindgen"] }

# ring を使う target:
#   - OpenBSD: aws-lc-rs は TLS ハンドシェイクを完了できない（F-122）。
#
# F-137: `system-tls` 有効時は `src/tls_provider.rs` が `rustls_openssl` を provider に
# 使うため `ring` は未使用になるが、依存としては残す（無条件依存のまま。上記参照）。
[target.'cfg(target_os = "openbsd")'.dependencies]
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
ring = "0.17"
# F-137: OpenBSD のみ、`system-tls`（quiche `openssl` feature、システム LibreSSL へ
# 動的リンク）と `openbsd-vendor-tls`（従来の quiche `boringssl-boring-crate`、
# `boring` crate 経由の vendored BoringSSL）を切り替えられるよう、quiche の TLS
# backend feature と `boring` crate の両方を optional にする（併用不可。上の
# [features] `openbsd-vendor-tls` のコメント参照）。
quiche = { version = "0.24.9", default-features = false, optional = true }
boring = { version = "4.3", optional = true }
# OpenBSD は wasm を **Pulley（ポータブルバイトコードインタープリタ）** で実行する。
# ネイティブ JIT コードの実行が OpenBSD で機能しないため（B-52）。
# `pulley` feature は base の [dependencies] wasmtime にも入っている（F-135:
# `[wasm] interpreter = true` で他ターゲットでも Pulley を選択可能にするため）。
# この target 別指定はバージョン/他 feature を OpenBSD 専用に固定するために残す
# （cargo は同一依存の feature を union するので重複指定しても無害）。
wasmtime = { version = "40.0.0", optional = true, features = ["pooling-allocator", "cranelift", "pulley"] }

# ====================
# Windows 専用依存（F-125/v0.6.0、WSAPoll reactor・Winsock ソケット層・Job Object）
# ====================
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

# ====================
# Unix 専用依存（nix: uname/sched/mount/hostname 等。Windows には存在しないクレートのため
# target 別依存に分離する。v0.6.0/F-125）
# ====================
[target.'cfg(unix)'.dependencies]
# nix: Unix システムコール用のRustラッパー
# - uname() でカーネルバージョン取得
# - セキュリティモジュールで使用
# - sched: namespace分離 (unshare)
# - mount: バインドマウント
# - hostname: ホスト名設定
nix = { version = "0.30.1", features = ["uio", "process", "feature", "sched", "mount", "hostname"] }

[dev-dependencies]
# テスト用一時ディレクトリ
tempfile = "3.24.0"

# プロパティベーステスト（F-56：ルーティング不変条件の検証。任意入力で panic なし・
# 決定性・キャッシュ整合を検査）。テスト専用のためデータプレーン依存には含めない。
proptest = "1"

# TLS証明書生成（テスト用自己署名証明書）
# 暗号バックエンドは target 別（下の [target.*.dev-dependencies] を参照。F-122 / B-51）

# ベンチマーク用
criterion = { version = "0.8.1", features = ["html_reports"] }

# システム情報取得（リソース使用量測定）
sysinfo = "0.37.2"

# E2Eテスト用TLS接続（rustlsを使用、メイン依存関係と一致）
# rustls と webpki-roots は既にメインの依存関係に含まれているため追加不要

# ベンチマーク用依存関係
base64 = "0.22.1"

# HTTP/3 ベンチマーク用乱数（benches/http3.rs。quiche 経由で依存済みのため追加コストなし）
ring = "0.17"

# HTTP/3 E2Eテスト用（quicheクライアント）
# 注意: quicheは既にメインの依存関係にoptionalとして追加されているため、
# dev-dependenciesでは通常の依存関係として追加（http3 featureが有効な場合のみ使用）

# ========================================
# 新規追加: HTTP/2・HTTP/3・gRPC テスト基盤
# ========================================

# 非同期ランタイム（テスト専用）
# 注意: 本体はmonoioを使用するが、テストクライアントはtokioを使用
tokio = { version = "1.48", features = ["full", "test-util"] }

