[workspace]
members = [".", "fuzz", "crates/veil-macros", "crates/veil-capi", "crates/veil-python", "crates/veil-build"]
# third_party/wasmtime は crates.io wasmtime 36.0.18（LTS）の vendoring（B-55 / B-79、path 依存）で
# あり、独立した crate ではあるがワークスペースメンバーではないため除外する
# （メンバーに含めると `cargo test`/`cargo clippy --workspace` 等が第三者コードである
# vendoring 先まで対象にしてしまう。詳細は third_party/wasmtime/README.veil.md）。
#
# 【既知の制約】cargo には「members に含まれるディレクトリ配下の path はこの
# exclude が効かない」バグがある（rust-lang/cargo#6745）。本プロジェクトは
# `members = ["."]` でルート自身がメンバーのため、配下の third_party/wasmtime は
# この exclude の対象外になり、`cargo metadata` 上は暗黙メンバーとして扱われ続ける。
# それでも意図の明示として残す（バグ修正後に効くようになる／将来 cargo が
# workspace root 自体を path 依存除外の起点として扱うようになった場合に備える）。
# 実害（third-party コードが cargo fmt/clippy --all-targets の対象になること）は
# `third_party/wasmtime/Cargo.toml` 側で `[[test]]` を削除し（未取り込みの tests/ を
# 参照していたため）、CI/検証コマンドは `-p veil` 相当（デフォルトカレントパッケージ）
# で third_party 配下まで踏み込まないことで実質的に回避する。
# tools/perf/h3load は perf 計測専用の独立クレート（HTTP/3 負荷生成ツール）。
# 本体のビルド・テスト・パッケージングから完全に切り離すためワークスペース外に置く
# （詳細は tools/perf/h3load/Cargo.toml の冒頭コメント）。計測時のみ
# `cargo build --release --manifest-path tools/perf/h3load/Cargo.toml` で明示ビルドする。
# third_party/quiche も同じ理由で除外する（F-172、crates.io quiche 0.24.9 の vendoring）。
# third_party/quinn-udp もテスト用 HTTP/3 クライアントの依存の vendoring（F-176 / B-62）で同じ扱い。
exclude = [
    "crates/veil-tokio/tokio-shim",
    "third_party/wasmtime",
    "third_party/quiche",
    "third_party/quinn-udp",
    "tools/perf/h3load",
    "tools/perf/alloc_bench",
]
# resolver v2: dev-dependencies の feature を通常ビルド（`cargo build`）へ統合しない。
# これにより OpenBSD 本体ビルドがテスト用 dev-deps（hyper-rustls/quinn/tokio-rustls/rcgen
# の aws_lc_rs）に引きずられて aws-lc-sys を要求することを防ぎ、ring のみでビルドできる
# （F-122）。edition 2021 パッケージ既定と一致。
resolver = "2"

# F-231: 版の出所はここ 1 箇所（ルートと crates/* は `version.workspace = true`。Python の版は maturin が
# crates/veil-python の版を読む）。上げるときは `tools/release/bump-version.sh <X.Y.Z>` を使う
# （ルートから veil-macros への依存の版と、ワークスペース外の Cargo.lock も一緒に更新する）。
# 公開の workflow（.github/workflows/release.yml）はタグとこの版が違えば何も公開しない。
[workspace.package]
version = "0.8.4"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["aofusa"]
repository = "https://github.com/aofusa/veil-proxy"

[package]
# F-238: crates.io の `veil`・`veil-macros` は別のプロジェクト（primait/veil）が使っているので、公開名は
# `veil-proxy`。ライブラリ名（`[lib] name`）とバイナリ名（`[[bin]] name`）は `veil` のままなので、
# `use veil::...`・`#[veil::route]`・`target/*/veil` は変わらない。利用側は
# `veil = { package = "veil-proxy", version = "..." }` と書く（マクロの生成コードが `::veil::` を使うため）。
name = "veil-proxy"
version.workspace = true
edition.workspace = true
description = "High-performance reverse proxy and API server library on io_uring, kTLS and rustls (HTTP/1.1, 2, 3, gRPC, Proxy-Wasm)"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/aofusa/veil-proxy"
documentation = "https://docs.rs/veil-proxy"
readme = "crates/README.crates-io.md"
keywords = ["proxy", "io-uring", "http3", "web-server", "api"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]
# crates.io の上限（10MB）に収め、利用者のビルドに要るものだけを入れる（tests/・docs/・tools/・fuzz/・
# benches/・third_party/ は入れない。third_party の quiche・wasmtime は別のクレートとして公開する）
include = [
    "/src/**",
    "/build.rs",
    "/Cargo.toml",
    "/crates/README.crates-io.md",
    "/LICENSE*",
]
build = "build.rs"

# F-239: docs.rs のビルド。ビルド時間の上限に収めるためターゲットは 1 つ。`docsrs` cfg で
# `doc_cfg`（どの feature が要る項目かの表示）を有効にする。
[package.metadata.docs.rs]
features = ["full", "api"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

# F-249: `cargo binstall veil-proxy` が GitHub Release のアーカイブから veil のバイナリだけを入れる（設定とページは入らない。
# docs/guide/running.md#configuration-file）。各アーカイブの minisign の署名（<アーカイブ>.sig）を下の公開鍵で検証する。
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/veil-{ version }-{ target }.tar.gz"
bin-dir = "veil-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSK8B6kNYXiqr3pLFklRgQoKpg+W3/GEAvZfXo+9qnhzgO6bXxQz+tl"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/veil-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/veil-{ version }-{ target }.zip"
pkg-fmt = "zip"

# macOS は universal2 の 1 つのアーカイブを両方の target で使う
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/veil-{ version }-universal2-apple-darwin.tar.gz"
bin-dir = "veil-{ version }-universal2-apple-darwin/{ bin }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/veil-{ version }-universal2-apple-darwin.tar.gz"
bin-dir = "veil-{ version }-universal2-apple-darwin/{ bin }"

[lib]
name = "veil"
path = "src/lib.rs"

[[bin]]
name = "veil"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# 配布用プロファイル `dist`（F-147）
# ---------------------------------------------------------------------------
# **`[profile.release]` はあえて定義しない**（cargo 既定のまま: lto=false /
# codegen-units=16）。Linux x86_64 と FreeBSD aarch64 の両方で実測した結果、
# LTO は**スループットに影響せず、効くのはバイナリサイズだけ**だった:
#
# | 計測 | release 既定 | fat LTO + cgu=1 |
# |---|---|---|
# | Linux 54KB / 3B | 2,542 / 4,793 rps | 2,571 / 4,803 rps（誤差範囲） |
# | FreeBSD 54KB / 3B | 22,995 / 161,028 rps | 22,832 / 159,064 rps（誤差範囲） |
# | サイズ Linux | 36.8MB | 28.9MB（-21.6%） |
# | サイズ FreeBSD | 31.8MB | 23.9MB（-24.9%） |
#
# veil のホットパスは syscall・TLS 暗号処理・コンテキストスイッチが支配的で、
# LTO がインライン化するクレート跨ぎ呼び出しのコストは相対的に小さいため。
#
# 一方で fat LTO + codegen-units=1 は release ビルドを大幅に遅くする
# （FreeBSD ゲストの増分ビルドで実測 26 秒 → 4 分 25 秒）。**速度に効かないものの
# ために日常のビルド（開発・E2E・perf 計測の反復）を遅くするのは割に合わない**ので、
# サイズ最適化は配布ビルド専用の `dist` プロファイルへ分離した。
#
# 使い方（packaging のスクリプト・Dockerfile が指定する。成果物は target/dist/ 配下）:
#   cargo build --profile dist --features full
#
# 【メモリ要件】fat LTO + codegen-units = 1 はリンク段階で大量のメモリを使う。
# **メモリ 4GB の FreeBSD ゲストでは OOM で失敗する**ことを実測で確認した
# （`Killed`）。VM でビルドする場合は 8GB 以上を割り当てること
# （`VM_MEM_MB=8192 tools/qemu/bsd-vm.sh ... up`）。割り当てられない環境では
# `release` でビルドし `packaging/scripts/build-bsd.sh` の strip でサイズを削る
# （strip 単体でも実測 -22%）。
# B-98: デバッグビルドでも Pulley インタープリタ（NetBSD 全アーキ・FreeBSD/OpenBSD aarch64 の
# wasmtime 実行系、B-55）だけは最適化する。opt-level 0 のままだと命令ディスパッチが桁違いに
# 遅く、E2E（デバッグビルド）で WAF モジュールを通るリクエストが 1 回 22 秒かかって
# 並行実行時にタイムアウトしていた（opt-level 3 で 0.2 秒）。小さいクレートなので
# ビルド時間への影響は小さく、Cranelift で動くターゲットでは実行経路に乗らない。
[profile.dev.package.pulley-interpreter]
opt-level = 3

[profile.dist]
inherits = "release"
# クレート跨ぎ最適化とコード生成単位の集約。目的はサイズ削減（上表）。
lto = "fat"
codegen-units = 1
# 配布バイナリはシンボル表まで除去する。実測: none 36.8MB →
# debuginfo 36.2MB（-1.7%）→ symbols 28.7MB（-22%）。release は debug=0 で
# DWARF がほぼ無いため、効くのはシンボル表の除去である。
# （開発・E2E・perf 計測は `--release` を使うのでシンボルが残り、DTrace や
#  バックトレースを関数名で読める。B-63 / kTLS のボトルネック特定に不可欠だった。）
strip = "symbols"
# **`panic = "abort"` は使ってはならない**（release から継承する unwind のまま）。
# `src/system.rs` の `CatchUnwindFuture` が `std::panic::catch_unwind` で
# コネクション単位のパニックを捕捉し、ワーカースレッドを生かしたままログに記録する
# （`spawn_with_panic_catch` / `spawn_pooled_with_panic_catch`）。abort にすると
# この保護が消え、**1 本の不正リクエストで生じた panic がプロキシ全体を落とす**。
# さらに巻き戻しが起きないため `ConnectionGuard` の Drop（接続数カウンタの整合性）も
# 走らない。サイズと僅かな速度のために可用性を捨てる取引は割に合わない。

[features]
# デフォルトビルド（kTLS + HTTP/2 + mimalloc）
default = ["ktls", "http2", "mimalloc"]

# ====================
# プロトコル系
# ====================

# kTLS（Kernel TLS）サポート
# 自前実装の ktls モジュールによる kTLS カーネルオフロードサポート
#
# 要件:
#   - Linux 5.15+ カーネル
#   - `modprobe tls` でkTLSモジュールをロード済み
#   - AES-GCM暗号スイートの使用
#
# ビルド方法: cargo build --features ktls
ktls = []

# HTTP/2 サポート
# ALPN ネゴシエーションにより HTTP/2 (h2) を使用
# kTLS と併用可能: cargo build --features "ktls,http2"
http2 = []

# HTTP/3 サポート (QUIC ベース)
# UDP/QUIC を使用した HTTP/3 プロトコル
# 注意: HTTP/3 は UDP ベースのため kTLS は使用不可
# GSO/GRO による高パフォーマンス UDP 処理
#
# ターゲット別 TLS バックエンド（.cargo/config.toml の [env] が AWS_LC_SYS_NO_PREFIX を制御）:
#   - linux                        : quiche (default-features=false) + 共有 aws-lc-sys (NO_PREFIX=1)
#   - freebsd/openbsd/netbsd/macos/windows : quiche (boringssl-boring-crate) + rustls 側の
#     aws-lc-rs（FreeBSD/macOS/Windows、NO_PREFIX=0 で共存）または ring（OpenBSD/NetBSD、
#     aws-lc-* は一切依存しない）
http3 = ["dep:quiche"]

# epoll ベースの readiness ランタイム（F-120 クロスプラットフォーム対応）
# デフォルトの io_uring 完了ベースランタイムの代わりに epoll ベースの
# reactor ランタイムを使う。Linux 専用（非 Linux では指定不要・
# 自動で kqueue ベースの reactor が選択される。build.rs 参照）。
# デフォルト機能構成は変更しない（default はこの feature を含まない）。
# ビルド方法: cargo build --features epoll
epoll = []

# FreeBSD 専用: POSIX AIO（aio_read/aio_write + EVFILT_AIO）による TCP read/write
# 完了通知ベース経路（F-127）。既定オフ。FreeBSD 以外で指定すると build.rs が panic する
# （epoll feature の非対応ターゲット扱いと同様）。既存の kqueue readiness 経路は
# このフィーチャー未指定時そのまま維持される（オプトイン、ゼロコスト）。
# ビルド方法（FreeBSD のみ）: cargo build --features aio
aio = []

# WASM Extension サポート (Proxy-Wasm v0.2.1)
# Wasmtime ランタイムによる WebAssembly フィルタ
# AOT コンパイル、Pooling Allocator、InstancePre 使用
# B-55: netbsd 全アーキ・freebsd/openbsd の aarch64 は crates.io wasmtime のビルドが
# 通らないため third_party/wasmtime（veil-proxy-wasmtime、Pulley 専用）に切り替える。
# 依存はターゲット別に排他なので、ビルドごとに実際に有効になるのはどちらか一方のみ
# （[target.*.dependencies] 参照）。
wasm = ["dep:wasmtime", "dep:veil-proxy-wasmtime"]

# gRPC サポート (HTTP/2 ベース)
# gRPC ワイヤプロトコル（framing, headers, trailers）を実装（メッセージは解析しないので protobuf の実装に依存しない）
# ビルド方法: cargo build --features grpc
grpc = []

# gRPC-Web サポート
# ブラウザ互換の gRPC-Web プロトコル変換
# CORS 設定は config.toml でルート毎に設定可能
grpc-web = ["grpc"]

# gRPC 全機能サポート
# HTTP/3 上の gRPC は http3 feature に依存
grpc-full = ["grpc", "grpc-web", "http3"]

# ====================
# メモリアロケータ（排他的に1つを選択）
# ====================

# mimalloc 高速メモリアロケータ（デフォルト）
# Huge Pages サポート付き
# ビルド方法: cargo build --features mimalloc（デフォルトで有効）
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

# jemalloc メモリアロケータ
# mimalloc / veil-alloc と排他的に使用（同時に有効化しないこと）
# ビルド方法: cargo build --no-default-features --features "ktls,http2,jemalloc"
jemalloc = ["dep:tikv-jemallocator"]

# veil 専用アロケータ（F-183、src/veil_alloc/）
# thread-per-core 向けのスレッドローカル・ページ単位フリーリスト。依存クレート無し（libc のみ）。
# mimalloc / jemalloc と排他的に使用する（`full` / `full-container` はこれだけを含む）。
# default の mimalloc と同時に有効な場合（`cargo build --features full`）は veil-alloc を優先して
# `#[global_allocator]` にする（unix のみ。Windows では無視して他のアロケータへフォールバックする）。
# ビルド方法: cargo build --features veil-alloc
veil-alloc = []

# システムアロケータ（明示的指定用）
# --no-default-features 時のデフォルト
# ビルド方法: cargo build --no-default-features --features system-allocator
system-allocator = []

# アロケーション計測（F-165 Phase 1）。opt-in・診断ビルド専用で `default` には
# 含めない（`full` / `full-container` / BSD 系バンドルにも含めないこと）。
# 有効化すると `#[global_allocator]` が mimalloc/jemalloc/システムアロケータを
# `CountingAllocator` で包んだものに差し替わり、1 リクエストあたりの
# ヒープアロケーション回数・バイト数を計測できる（`src/alloc_stats.rs`）。
# ビルド方法: cargo build --features "full,alloc-stats"
alloc-stats = []

# ====================
# 機能系（オプション）
# ====================

# レスポンス圧縮（Gzip/Brotli/Zstd）
# ビルドサイズとセキュリティサーフェスを削減したい場合はオフに
# ビルド方法: cargo build --features compression
compression = ["dep:flate2", "dep:brotli", "dep:zstd"]

# プロキシキャッシュ（インメモリ + ディスク）
# dashmap/lru/glob を使用したレスポンスキャッシュ
# ビルド方法: cargo build --features cache
cache = ["dep:dashmap", "dep:glob"]

# Prometheusメトリクス出力
# リクエスト数、レイテンシ、エラー率などを計測・エクスポート
# ビルド方法: cargo build --features metrics
metrics = ["dep:prometheus"]

# WebSocket プロキシサポート
# Upgrade ヘッダー検出による双方向プロキシ
# ビルド方法: cargo build --features websocket
websocket = []

# レートリミット・接続制限
# スライディングウィンドウ式レートリミット
# ビルド方法: cargo build --features rate-limit
rate-limit = []

# 高度なレスポンスバッファリング制御
# 低速クライアントによるバックエンド占有防止
# ビルド方法: cargo build --features buffering
buffering = []

# OpenTelemetry (OTLP/HTTP) メトリクスエクスポート（F-10 Phase 1）
# データプレーンは tokio-free のため、専用の std スレッドで
# OTLP/HTTP (JSON) を std::net::TcpStream で送信する軽量実装。
# 重い opentelemetry クレート（tokio 依存）は使用しない。
# metrics feature と併用することで Prometheus レジストリの値をブリッジする。
# ビルド方法: cargo build --features opentelemetry
opentelemetry = []

# 管理 Admin API（F-20: キャッシュ Purge、F-21: /config, /stats, /reload, /tls/reload）
# /__admin エンドポイントを有効化する。Bearer 認証 + IP 制限つき。
# キャッシュ Purge は cache feature と併用することで有効になる。
# ビルド方法: cargo build --features admin
admin = []

# 構造化アクセスログ（F-21）
# JSON / テキスト形式でリクエスト単位のアクセスログを出力する。
# スレッドローカルバッファによりヒープアロケーションを最小化。
# アプリケーションログ（[logging]）とは独立したファイルに書き込める。
# ビルド方法: cargo build --features access-log
access-log = []

# L4 (TCP/UDP) ストリームプロキシ（F-18）
# nginx stream / Envoy TCP proxy 相当の L4 レイヤープロキシ機能。
# HTTP 以外のユースケース（DB 接続、バイナリプロトコル等）をサポート。
# TLS passthrough / termination、接続数制限、LB（RR / LeastConn）を含む。
# ビルド方法: cargo build --features l4-proxy
l4-proxy = []

# VDS（Veil Discovery Service、F-04）: 制御プレーンからルート・アップストリームを動的に配信する
# （xDS の REST-JSON / State-of-the-World 相当の長輪詢）。専用スレッドで動き、データプレーンには触れない。
# 制御プレーンとの gRPC のメッセージだけは prost の derive で持つ（veil で prost を使うのは VDS だけ。F-208）。
vds = ["dep:serde_json", "dep:prost", "grpc", "http2"]
# ACME（F-05）: Let's Encrypt 等から証明書を自動で発行・更新する（HTTP-01）。専用スレッドで動き、
# 発行した証明書は既存の証明書ホットリロードで無停止に差し替える。
acme = ["dep:serde_json", "dep:rcgen"]
# JWT の検証（F-220）: ルートの `[route.jwt]`（署名・iss・aud・exp と claim の条件）。暗号は rustls と同じプロバイダ。
jwt = ["dep:serde_json"]

# ====================
# サービスメッシュのデータプレーン（F-215〜F-225）。Istio の Envoy・Linkerd のプロキシを veil に置き換える。
# default・full* には入れない（F-215 の必須条件: メッシュを使わない既存のプロキシの性能を退行させない）。
# Linux のみ（Kubernetes のノード。SO_ORIGINAL_DST・iptables の REDIRECT が前提）。
# 設計: docs/backlog/features/F-215-service-mesh-dataplane.md
# ====================
# 共通部（メッシュモデル・透過転送・ワークロード ID の mTLS・L7・観測）
mesh = ["dep:prost", "dep:serde_json", "dep:regex", "http2", "grpc", "jwt"]
# Istio のサイドカー・ゲートウェイ（Envoy 互換の起動・Envoy の xDS v3 の変換・SDS・管理 API の模倣。F-222・F-224）
mesh-istio = ["mesh"]
# Linkerd のプロキシ（linkerd2-proxy-api・プロキシ同士の取り決め。F-223）
mesh-linkerd = ["mesh"]

# ====================
# API サーバ基盤ライブラリ（F-188〜F-192）。veil を他のアプリにライブラリとして組み込む用途。
# いずれも default・full* に含めない（本体ビルドにライブラリ用コードを入れない）。
# 設計: docs/backlog/features/F-188-api-library-core.md
# ====================

# ネイティブ Handler アクション（`type = "Handler"`）・Request/Response・設定ビルダ・ライブラリ既定設定
handler = ["http2", "dep:serde_json", "dep:serde_urlencoded", "dep:inventory", "handler-pool"]
# 内部用: ハンドラ用ブロッキングプールと別スレッドからの完了受け取り（runtime::offload::await_completion）。
# handler と tokio-compat が使う（単独で選ぶものではない）
handler-pool = []
# 内部用: tower の Service/Layer 互換（veil::api::tower）。api-core と tokio-compat-bridge が使う
tower-compat = [
    "handler",
    "dep:tower-service",
    "dep:tower-layer",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
]
# ルート定義用 proc-macro（#[veil::route] / #[veil::l4_handler] / #[veil::main] / #[derive(veil::Schema)]）
macro = ["handler", "dep:veil-macros"]
# マクロのメタデータからの OpenAPI 3.1 生成・Swagger UI（F-189）
openapi = ["handler", "macro"]
# tokio 互換レイヤー（F-198）。2 つは排他（両方有効は compile_error）。tower の Service/Layer 互換は api-core に含む。
# - tokio-compat（api の既定）: tokio 無し。veil のランタイムの上に tokio の API（veil::tokio、crates/veil-tokio/tokio-shim
#   で依存ツリーの tokio を置き換えられる）を提供する。handler に依存しない（置き換えた tokio が serde_json 等を
#   引き込まないように）。
# - tokio-compat-bridge: tokio のランタイムを同梱して Future を tokio 上で実行し、結果を通知 fd で受け取る（旧 F-190）。
#   tokio の内部に強く依存するクレート向け。api には含めない（api-core と組み合わせて選ぶ）。
tokio-compat = ["handler-pool", "dep:tokio-macros"]
tokio-compat-bridge = ["tower-compat", "dep:tokio"]
# L4（TCP/UDP）リスナーに Rust 関数をネイティブハンドラとして登録（F-192）
l4-handler = ["handler", "l4-proxy"]
# gRPC サーバ（F-197、veil の gRPC 実装。tokio・tonic・prost 非依存。メッセージは利用者の codec（veil-build の
# 生成コードは prost）が符号化する。F-208）。API ライブラリ専用
grpc-handler = ["handler", "grpc"]
# tokio 互換レイヤー以外の API ライブラリ一式（tokio-compat-bridge と組み合わせるときに使う）
api-core = ["handler", "macro", "openapi", "l4-handler", "grpc-handler", "tower-compat"]
# API サーバ開発向けの便利セット（C API・Python は別クレート crates/veil-capi・crates/veil-python）
api = ["api-core", "tokio-compat"]

# ====================
# 複合フィーチャ（便利用）
# ====================

# 全機能ビルド
full = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "veil-alloc",
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
]

# BSD 向けの全機能ビルド（packaging 用）
# ---------------------------------------------------------------------------
# `full` との違いはアロケータと FreeBSD 専用の I/O 経路だけで、機能セットは同一。
# cargo にはターゲット別の default features が無いため、`full` からアロケータを
# 差し替えたセットを別 feature として用意し、packaging のビルドスクリプト
# （packaging/scripts/build-cross.sh・tools/qemu/bsd-vm.sh）が
# `--no-default-features --features full-freebsd|full-openbsd|full-netbsd` で明示指定する。
# 通常の `--features full` は unix で veil-alloc（F-183）を使う（Windows は default の mimalloc、
# `--no-default-features` ならシステムアロケータ）。
# Windows・macOS も同じ理由で `full-windows`（mimalloc）/ `full-macos`（システムアロケータ）を
# 用意し、packaging/scripts/build-cross.sh と docker/Dockerfile.{windows,macos} が使う（F-184）。
#
# **アーキテクチャ非依存**: 以前は aarch64 用に `full-freebsd-aarch64` /
# `full-openbsd-aarch64` / `full-netbsd-aarch64` を別途用意していたが、中身は
# 対応する `full-*bsd` と完全に同一だったため廃止した。B-55（NetBSD 全アーキ・
# FreeBSD/OpenBSD の aarch64 で crates.io wasmtime がビルドできない問題）の切り替えは
# **feature ではなくターゲット別依存**（下の `[target.'cfg(...)'.dependencies]` で
# `wasmtime` と vendoring 版 `veil-wasmtime` を排他選択）で行っているため、
# feature セットを arch ごとに分ける必要がそもそも無い。x86_64 でも aarch64 でも
# `--features full-freebsd` 等をそのまま使う。

# FreeBSD: mimalloc を使わずシステムの malloc(3)（= libc 内蔵の jemalloc）を使う。
# B-89: 以前は tikv-jemallocator（`jemalloc` feature）を載せていたが、FreeBSD 向けに
# ビルドされた jemalloc は libthr のフック（`_malloc_thread_cleanup` /
# `_malloc_prefork` / `_malloc_postfork`）をプレフィックス無しで定義し、libc 内蔵
# jemalloc のフックを上書きしてしまう。スレッド終了時に libc 側のスレッドキャッシュが
# 片付けられず、次のスレッド生成で libc の malloc がクラッシュする（単体テストの
# 並列実行で 100% 再現）。libc の malloc がそもそも jemalloc なので失うものは無い。
full-freebsd = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    # B-63 / F-145: `aio`（F-127 の POSIX AIO 経路）は **既定から外した**。
    #   - 性能: aio_read/aio_write は「submit + aio_error + aio_return」で
    #     1 I/O あたり 3 syscall を要し、readiness 経路（read/write 1 発）より遅い。
    #     FreeBSD 14.3 aarch64 実測で小レスポンス HTTP/1.1 TLS が
    #     105,520 → 187,374 rps（+77.6%）、L4 TCP が 37k → 202k rps。
    #     54KB の大きな応答では有意差なし（21.5k 対 21.3k）＝利点が無い。
    #   - 正しさ: HTTP/2 で小さな応答を高並行に返すとサーバが完全に停止する
    #     （B-63。全スレッドが sleep のまま CPU を消費せず応答しなくなる）。
    # feature 自体は残してあるので `--features aio` で従来どおり明示有効化できる。
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
]

# OpenBSD: システムアロケータ（global_allocator を差し替えない）を使う。
# mimalloc / jemalloc とも有効化しないことでシステム malloc(3) が使われる。
# OpenBSD の wasm は **Pulley インタープリタ**で実行する（B-52）。
# wasmtime の Cranelift JIT が生成するネイティブコードは OpenBSD で動かず、
# wasm モジュールを 1 回実行しただけで veil ごと SIGSEGV するため、
# `src/wasm/registry.rs` が OpenBSD のみ `Config::target("pulley64")` を指定する。
# rustls=ring、quiche=boringssl-boring-crate（いずれも target 別依存で無条件付与）。
full-openbsd = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
]

# NetBSD: OpenBSD をテンプレートに横展開した feature セット（F-140）。
# NetBSD には pledge/unveil 相当のランタイム API が無く（`src/security.rs` の
# `netbsd` モジュール参照）、veil が提供できるのは chroot(2) + 特権降格 + rlimit
# のみだが、TLS/機能セット自体は OpenBSD と同一内容にできる
# （rustls=ring、quiche=boringssl-boring-crate）。
# システムアロケータ（mimalloc/jemalloc とも無効化）を使う点も OpenBSD と同じ。
#
# **wasm を含む（B-55 解消）**。NetBSD は全アーキテクチャで crates.io wasmtime（36 / 40 とも）の
# ビルドが通らない（`signals.rs` に NetBSD 向け ucontext 分岐が一切無く、x86_64 でも
# `compile_error!("unsupported platform")` になる）が、FreeBSD/OpenBSD aarch64 と同様に
# `third_party/wasmtime`（`veil-wasmtime`）＋ Pulley インタープリタ実行で解消した。
full-netbsd = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
]

# Windows: veil-alloc（unix 専用）の代わりに mimalloc を使う（F-184）。
# 機能セットは `full` と同一（`ktls` は Linux/FreeBSD 以外では build.rs が無効化する）。
# packaging/scripts/build-cross.sh --target windows（docker/Dockerfile.windows）が使う。
full-windows = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "mimalloc",
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
]

# macOS: mimalloc・veil-alloc を使わずシステムアロケータ（libmalloc）を使う（F-184）。
# 機能セットは `full` と同一。packaging/scripts/build-cross.sh --target macos
# （docker/Dockerfile.macos）が使う。
full-macos = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "system-allocator",
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
]

full-container = [
    "ktls", "http2", "http3",
    "grpc-full", "wasm",
    "opentelemetry",
    "compression", "cache", "metrics",
    "websocket", "rate-limit", "buffering",
    "veil-alloc",
    "admin",
    "access-log",
    "l4-proxy",
    "vds",
    "acme",
    "jwt",
    "epoll",
]

[dependencies]
# monoio 削除: カスタム io_uring 実装 (src/runtime/) に完全移行
# rustls を直接使用（ハンドシェイク後に kTLS へオフロード）。
# 暗号プロバイダは target 別に選択する（F-122、src/tls_provider.rs 参照）:
#   - 非 OpenBSD（Linux/FreeBSD）: aws_lc_rs（kTLS・quiche と AWS-LC 共有）
#   - OpenBSD: ring（aws-lc-rs は OpenBSD で TLS ハンドシェイクを完了できないため）
# provider feature は下の [target.*] で付与し、ここでは共通 feature のみ指定する。
rustls = { version = "0.23.35", default-features = false, features = ["std", "tls12", "logging"] }
webpki-roots = "1.0.4"
rustls-pki-types = "1.13.2"
libc = "0.2.178"
# mimalloc 高速メモリアロケータ（mimalloc feature で有効化）
mimalloc = { version = "0.1.48", default-features = false, optional = true }
# Huge Pages (Large OS Pages) 設定用
# mimallocの低レベルAPIを使用してLarge OS Pagesを有効化
# extendedフィーチャーでmi_option_set等のAPIを使用可能に
libmimalloc-sys = { version = "0.1.44", features = ["extended"], optional = true }
# jemalloc メモリアロケータ（jemalloc feature で有効化）
tikv-jemallocator = { version = "0.6", optional = true }
toml = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
httparse = "1.10.1"
memchr = "2.7.6"
bytes = "1.11.0"
anyhow = "1.0.100"
mime_guess = "2.0.5"
num_cpus = "1.17.0"
ftlog = "0.2.15"
time = "0.3.44"
hostname = "0.4.2"
itoa = "1.0.17"

# CPUアフィニティ設定
# 各ワーカースレッドを特定のCPUコアに固定し、キャッシュ効率を向上
core_affinity = "0.8.3"



# 高速ルーティング（Radix Tree）
# O(n)線形探索からO(log n)に改善
matchit = "0.9.1"

# 設定のホットリロード対応
# ロックフリーな設定更新を実現
arc-swap = "1.8.0"
once_cell = "1.21.3"
signal-hook = "0.4.1"

# Prometheusメトリクス対応（metrics feature で有効化）
# リクエスト数、レイテンシ、エラー率などを計測・エクスポート
prometheus = { version = "0.14.0", optional = true }
clap = { version = "4.5.53", features = ["derive"] }

# HTTP/3 用 QUIC 実装（Cloudflare quiche）は末尾の target.*.dependencies で定義

# Wasmtime: WebAssembly ランタイム (Proxy-Wasm v0.2.1) は B-55 でターゲット別依存に
# 分割したため、末尾の [target.*.dependencies]（`wasmtime` / `veil-wasmtime`）で定義する。

# Protobuf: gRPC メッセージのシリアライズ/デシリアライズ
# prost は VDS（vds feature）の制御プレーンのメッセージにだけ使う（F-208）
prost = { version = "0.13", optional = true }

# ====================
# レスポンス圧縮ライブラリ（compression feature で有効化）
# ====================
# Gzip圧縮（flate2）
# - ストリーミング圧縮対応
# - 圧縮レベル1-9をサポート
flate2 = { version = "1.1.5", optional = true }

# Brotli圧縮
# - 高圧縮率（Gzipより10-20%効率的）
# - ストリーミング圧縮対応
# - 圧縮レベル0-11をサポート
brotli = { version = "8.0.2", optional = true }

# Zstandard (zstd) 圧縮
# - 高速かつ高圧縮率（Gzipより高速で高圧縮）
# - ストリーミング圧縮対応
# - 圧縮レベル1-22をサポート
zstd = { version = "0.13.3", optional = true }

# ====================
# プロキシキャッシュ・バッファリング制御
# ====================
# ロックフリー並行ハッシュマップ（キャッシュインデックス用、cache feature で有効化）
# - 高並行性アクセスに最適化
# - スレッドセーフな挿入・削除・検索
dashmap = { version = "6.1.0", optional = true }

# LRU キャッシュ（ルーティングキャッシュ・メモリキャッシュのeviction用）
# - O(1)の挿入・検索・削除
# - 最大容量制限とLRU eviction
# - ルーティングキャッシュで常に使用するため常時有効
lru = "0.18.2"

# 高速ハッシュ関数（キャッシュキー生成用）
# - xxHash3: 非常に高速なハッシュ関数
# - キャッシュキーの生成、ルーティングキャッシュ、バッファリングで使用
# - ルーティングキャッシュ等で常時使用するため常時有効
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# ホットパスの HashMap / LRU / DashMap 用の高速ハッシャ（乱数シード付き）。短いキー
# （ルートキャッシュの u64、QUIC 接続 ID、ファイルパス）で SipHash や xxh3 のストリーミング
# ハッシャより速い。hashbrown が既に依存しているクレートで、新規の依存は増えない。
foldhash = "0.2"

# glob パターンマッチング（キャッシュバイパス設定用、cache feature で有効化）
# - シンプルなワイルドカードパターン
# - 正規表現より高速
glob = { version = "0.3.3", optional = true }
rayon = "1.12.0"
futures = "0.3.31"

# ====================
# API サーバ基盤ライブラリ（`handler` 系 feature のみ。F-188〜F-191）
# ====================
serde_json = { version = "1.0", optional = true }
# メッシュ（F-219）のルートの正規表現（Envoy の safe_regex。RE2 互換の構文の範囲）
regex = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
# マクロで定義したルート・L4 ハンドラの静的登録（リンク時に収集）
inventory = { version = "0.3", optional = true }
veil-macros = { package = "veil-proxy-macros", path = "crates/veil-macros", version = "0.8.4", optional = true }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }
http = { version = "1.4", optional = true }
http-body = { version = "1.0", optional = true }
http-body-util = { version = "0.1.3", optional = true }
tokio = { version = "1.48", optional = true, default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
# tokio-compat の #[tokio::main] / #[tokio::test] と select! の補助（proc-macro だけ。tokio 本体には依存しない）
tokio-macros = { version = "2.5", optional = true }

# ====================
# rustls 暗号プロバイダの target 別選択（F-122、src/tls_provider.rs 参照）
# ====================
# aws_lc_rs を使う target:
#   - 非 OpenBSD/NetBSD（Linux/FreeBSD/macOS/Windows）: kTLS（ktls_rustls）・quiche(http3) と
#     AWS-LC を共有し、アセンブリ最適化が効く。http3_server の RNG（aws_lc_rs::rand）にも使う。
#
# `rustls` 本体（std/tls12/logging）は base の [dependencies] で無条件に宣言済みのため、
# ここでは `aws_lc_rs` cargo feature を追加で有効化する（Cargo は同一クレートへの複数の
# 依存宣言の features を union する）。
[target.'cfg(not(any(target_os = "openbsd", target_os = "netbsd")))'.dependencies]
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs"] }
# bindgen: AWS_LC_SYS_NO_PREFIX 時に aws-lc-sys がバインディング生成するため必要
aws-lc-rs = { version = "1.15.2", features = ["bindgen"] }
# ACME（F-05、`acme` feature）の CSR・鍵生成・仮の自己署名証明書。暗号は rustls と同じ aws-lc-rs。
rcgen = { version = "0.14.6", optional = true, default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }

# ring を使う target:
#   - OpenBSD: aws-lc-rs は TLS ハンドシェイクを完了できない（F-122）。
#   - NetBSD: OpenBSD と同じ扱い（F-140、未検証だが aws-lc-rs の Tier 3 サポート
#     不足という同じ懸念があるため、実証済みの OpenBSD 側に合わせる保守的な選択）。
[target.'cfg(any(target_os = "openbsd", target_os = "netbsd"))'.dependencies]
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
ring = "0.17"
# ACME（F-05、`acme` feature）。OpenBSD/NetBSD は rustls と同じ ring。
rcgen = { version = "0.14.6", optional = true, default-features = false, features = ["crypto", "pem", "ring"] }
# OpenBSD/NetBSD の quiche(http3) は vendored BoringSSL（`boringssl-boring-crate` feature、
# 外部 `boring` crate 経由）を無条件で使う（FreeBSD/macOS/Windows と同じ構成、F-136）。
quiche = { package = "veil-proxy-quiche", path = "third_party/quiche", version = "=0.24.9-veil.2", default-features = false, features = ["boringssl-boring-crate"], optional = true }
# quiche 0.24.9 が依存する boring のバージョンと必ず一致させること（異なると
# `SslContextBuilder` の型が別物になりコンパイルエラーになる）。FreeBSD/macOS/Windows と
# 同じ理由で optional にしない。
boring = "4.3"
# OpenBSD/NetBSD は wasm を **Pulley（ポータブルバイトコードインタープリタ）** で
# 実行する。ネイティブ JIT コードの実行が OpenBSD で機能しないため（B-52）。NetBSD は
# MAP_STACK 強制は無いが、ネイティブ JIT 自体の実機検証ができていないため OpenBSD と
# 同じ保守的な Pulley 選択にする（F-140、`src/wasm/registry.rs` 参照）。
# wasmtime 依存自体は B-55 でターゲット別（本セクションの cfg と一部重なる）に
# 分離したため、ここには重複させない。以前はここに OpenBSD/NetBSD 専用の
# `wasmtime = {...}` 重複指定があったが（cargo が feature を union する前提の保険）、
# この cfg（openbsd/netbsd）は下の `<BSD_NOSIG>` cfg（netbsd 全体・openbsd aarch64）と
# 重なりがあり、同一依存グラフに lib 名 "wasmtime" を持つクレートを 2 つ
# （crates.io 版と path 版）混在させかねないため削除した。
# wasmtime/veil-wasmtime の実体は下の
# `[target.'cfg(not(<BSD_NOSIG>))'.dependencies]` /
# `[target.'cfg(<BSD_NOSIG>)'.dependencies]`（B-55）を参照。

# ====================
# Wasmtime: WebAssembly ランタイム (Proxy-Wasm v0.2.1) のターゲット別選択（B-55）
# ====================
# <BSD_NOSIG> = netbsd 全アーキ ∪ (openbsd, aarch64) ∪ (freebsd, aarch64)。
# これらのターゲットは crates.io wasmtime（36 / 40 とも）の signals.rs に ucontext 分岐が無く
# `compile_error!("unsupported platform")` になるため third_party/wasmtime
# （`veil-proxy-wasmtime`、Pulley 専用、詳細は third_party/wasmtime/README.veil.md）に切り替える。
# 依存キーを分けているのは、同一キー `wasmtime` に対し crates.io と path の 2 つの
# source を target 別に与えると cargo が
# 「Dependency 'wasmtime' has different source paths depending on the build target」
# で解決を拒否するため（`[lib] name = "wasmtime"` は両方とも変えていないので、
# Rust コード側の `use wasmtime::...` はどちらの経路でも無変更で動く）。
#
# - pooling-allocator: 高速インスタンス化
# - cranelift: AOT コンパイル（<BSD_NOSIG> 側は Pulley 強制のため実質未使用）
# - pulley: ポータブルバイトコードインタープリタ（`Config::target("pulleyNN")`）。
#   `[wasm] interpreter = true`（F-135）・OpenBSD（B-52）・<BSD_NOSIG>（B-55）で常時使用。
# - 既定の feature のうち `profiling`（perf の jitdump・VTune）だけを外す。veil は使わず、保守終了の `fxhash`
#   （RUSTSEC-2025-0057、`fxprof-processed-profile` 経由）を依存に持ち込むため。残りは既定のまま（B-158）。
[target.'cfg(not(any(target_os = "netbsd", all(target_os = "openbsd", target_arch = "aarch64"), all(target_os = "freebsd", target_arch = "aarch64"))))'.dependencies]
wasmtime = { version = "36.0.19", optional = true, default-features = false, features = ["async", "cache", "gc", "gc-drc", "gc-null", "wat", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "threads", "stack-switching", "std", "pulley"] }

[target.'cfg(any(target_os = "netbsd", all(target_os = "openbsd", target_arch = "aarch64"), all(target_os = "freebsd", target_arch = "aarch64")))'.dependencies]
# 依存のキーはパッケージ名と同じにする（`package =` で別名にすると、クレートの名前が `[lib] name = "wasmtime"` ではなく
# キー〈veil_wasmtime〉になり、`use wasmtime::...` が解決できない。F-238 の改名で FreeBSD aarch64 のビルドが壊れた）
veil-proxy-wasmtime = { path = "third_party/wasmtime", version = "36.0.19", optional = true, default-features = false, features = ["async", "cache", "gc", "gc-drc", "gc-null", "wat", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "threads", "stack-switching", "std", "pulley"] }

# ====================
# Windows 専用依存（F-125/v0.6.0、WSAPoll reactor・Winsock ソケット層・Job Object）
# ====================
[target.'cfg(windows)'.dependencies]
# Ctrl-C / Ctrl-Break でのシャットダウン（unix は signal-hook で SIGINT / SIGTERM を受ける。
# ctrlc は termination feature 無しでは SIGTERM を捕まえず、有効にすると SIGHUP も奪うため。B-115）
ctrlc = "3.5.1"
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Console",
] }

# ====================
# Unix 専用依存（nix: uname/sched/mount/hostname 等。Windows には存在しないクレートのため
# target 別依存に分離する。v0.6.0/F-125）
# ====================
[target.'cfg(unix)'.dependencies]
# nix: Unix システムコール用のRustラッパー
# - uname() でカーネルバージョン取得
# - セキュリティモジュールで使用
# - sched: namespace分離 (unshare)
# - mount: バインドマウント
# - hostname: ホスト名設定
nix = { version = "0.30.1", features = ["uio", "process", "feature", "sched", "mount", "hostname"] }

[dev-dependencies]
# gRPC ハンドラの手書きの符号化（health 等）を prost と突き合わせる（F-208）
prost = "0.13"
# テスト用一時ディレクトリ
tempfile = "3.24.0"

# プロパティベーステスト（F-56：ルーティング不変条件の検証。任意入力で panic なし・
# 決定性・キャッシュ整合を検査）。テスト専用のためデータプレーン依存には含めない。
proptest = "1"

# TLS証明書生成（テスト用自己署名証明書）
# 暗号バックエンドは target 別（下の [target.*.dev-dependencies] を参照。F-122 / B-51）

# ベンチマーク用
criterion = { version = "0.8.1", features = ["html_reports"] }

# システム情報取得（リソース使用量測定）
sysinfo = "0.37.2"

# E2Eテスト用TLS接続（rustlsを使用、メイン依存関係と一致）
# rustls と webpki-roots は既にメインの依存関係に含まれているため追加不要

# ベンチマーク用依存関係
base64 = "0.22.1"

# HTTP/3 ベンチマーク用乱数（benches/http3.rs。quiche 経由で依存済みのため追加コストなし）
ring = "0.17"

# HTTP/3 E2Eテスト用（quicheクライアント）
# 注意: quicheは既にメインの依存関係にoptionalとして追加されているため、
# dev-dependenciesでは通常の依存関係として追加（http3 featureが有効な場合のみ使用）

# ========================================
# 新規追加: HTTP/2・HTTP/3・gRPC テスト基盤
# ========================================

# 非同期ランタイム（テスト専用）
# 注意: 本体は独自ランタイム（src/runtime/）を使用するが、テストクライアントはtokioを使用
tokio = { version = "1.48", features = ["full", "test-util"] }

# HTTP/2クライアント
h2 = "0.4.12"
http = "1.4.0"
# HTTP/1.1 + HTTP/2クライアント
hyper = { version = "1.8.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.19", features = ["client", "client-legacy", "http1", "http2", "tokio"] }

# gRPCクライアント（HTTP/2ベース）
# TLS プロバイダは target 別（下の [target.*.dev-dependencies] を参照）
tonic-build = "0.14.2"

# テストクライアントの rustls 暗号プロバイダ（F-122 / B-51）
#
# 本体 (`src/tls_provider.rs`) と同じく **OpenBSD だけ ring**、他は aws_lc_rs にする。
# OpenBSD で aws-lc-rs を使うと aws-lc-sys の curve25519（s2n-bignum アセンブリ）で
# SIGSEGV し、E2E テストバイナリがテスト 1 件目で落ちる（B-51）。
# resolver = "2" により dev-dependencies の feature は本体ビルドへ波及しない。
# quinn の `rustls` feature は `rustls-ring` の別名なので target 分割は不要。
# HTTP/3クライアント（QUIC/quinn + h3）
h3 = "0.0.8"
quinn = { version = "0.11.9", features = ["runtime-tokio", "rustls"] }
h3-quinn = "0.0.10"

# gRPC over HTTP/3（実験的）
# 注意: 実験的ステータスのため、APIが変更される可能性あり
tonic-h3 = "0.0.5"

# 共通ユーティリティ
futures = "0.3.31"
http-body-util = "0.1.3"
ntest = "0.9.5"
serial_test = "3.5.0"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "http2"
harness = false

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "tls"
harness = false

[[bench]]
name = "connection_pool"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "load_balancing"
harness = false

# quiche を直接使うため http3 が必要。無指定だと `--all-targets` で
# feature 無効時にも展開され `unresolved module quiche` になる。
[[bench]]
name = "http3"
harness = false
required-features = ["http3"]

[[bench]]
name = "websocket"
harness = false

[[bench]]
name = "memory"
