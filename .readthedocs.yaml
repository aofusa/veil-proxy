# Read the Docs の設定（F-239）。veil-api（Python バインディング）の文書を作る。
# Rust の拡張はコンパイルしない（sphinx-autoapi が .py と _veil.pyi を静的に読む）。
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: crates/veil-python/docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: crates/veil-python/docs/requirements.txt
