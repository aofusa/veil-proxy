# B-238: ワークフローのアクションは SHA で固定しているので、更新は dependabot の PR で受ける
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # B-239: Dockerfile のベースイメージは digest で固定しているので、更新は dependabot の PR で受ける
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
