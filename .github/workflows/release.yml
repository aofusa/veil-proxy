# F-237 / F-238 / F-247: タグ vX.Y.Z の push で、コンテナイメージ（ghcr.io）・Rust のクレート（crates.io）・
# Python の wheel（PyPI）を公開し、各 OS の成果物（dist.yml）とリリースノートを付けた GitHub Release の draft を作る。
# draft を確かめて公開するのは人（公開を契機に release-downstream.yml が Docker Hub・Homebrew・apt/dnf・winget を更新する）。
#
# - 版はタグの版。タグ（v を除く）と Cargo.toml の [workspace.package] version が違えば何も公開しない（F-231）。
# - プレリリースのタグ（v0.8.0-rc.1 のように - を含む）では:
#     イメージ … 版のタグ（musl-v…・glibc-v…）だけを付け、latest・musl・glibc は動かさない
#     crates  … cargo publish --dry-run だけ（crates.io の公開は取り消せないため）
#     PyPI    … TestPyPI へ送る
# - 鍵は置かない: ghcr は GITHUB_TOKEN、crates.io と PyPI は trusted publishing（OIDC）。最初の 1 回だけ人が行う
#   準備は packaging/README.md の「公開（リリース）」の節。
# - 外部の action はコミットの SHA で固定する（F-236 の供給網の観点）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するタグ（例: v0.8.0-rc.1）。既に push 済みのもの"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/veil

jobs:
  verify:
    name: verify tag and version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: tools/release/verify-tag.sh "$TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 依存の勧告（B-158）: 既知の脆弱性・保守終了・unsound・yanked の依存があれば何も公開しない
  # ---------------------------------------------------------------------------
  advisories:
    name: dependency advisories
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: cargo audit (every Cargo.lock, warnings are errors)
        run: tools/container_security/security/run_cargo_audit.sh
      - name: cargo deny (advisories, licenses)
        env:
          SKIP_CARGO_DENY: "0"
        run: tools/container_security/security/run_cargo_deny.sh

  # ---------------------------------------------------------------------------
  # コンテナイメージ（F-237）
  # ---------------------------------------------------------------------------
  image:
    name: image ${{ matrix.variant }}/${{ matrix.arch }}
    needs: [verify, advisories]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    strategy:
      # 1 つの失敗で他のアーキのビルドを取り消さない（どれが通るかを 1 回で見る）
      fail-fast: false
      matrix:
        include:
          - { variant: musl, arch: amd64, file: docker/Dockerfile.musl }
          - { variant: musl, arch: arm64, file: docker/Dockerfile.musl.aarch64 }
          - { variant: glibc, arch: amd64, file: docker/Dockerfile.glibc }
          - { variant: glibc, arch: arm64, file: docker/Dockerfile.glibc.aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # F-246: ghcr.io のページと docker inspect に出る説明（index の注釈は publish-images.sh が付ける）
      - id: desc
        run: echo "text=$(cat packaging/container/description.txt)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          # aarch64 の Dockerfile は x86_64 のビルダーでクロスビルドし、最後の段だけ arm64 にする
          platforms: linux/${{ matrix.arch }}
          # 公開イメージは full-container（epoll の readiness reactor）の 1 本だけ。コンテナ既定の seccomp
          # （Docker の既定・Kubernetes の RuntimeDefault）は io_uring を拒否するので、io_uring 版は入れない
          build-args: |
            CARGO_FEATURES=full-container
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0 OR MIT
            org.opencontainers.image.description=${{ steps.desc.outputs.text }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.variant }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 7

  image-test:
    name: image test ${{ matrix.variant }}/${{ matrix.arch }}
    needs: [verify, image]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: musl, arch: amd64, runner: ubuntu-24.04 }
          - { variant: musl, arch: arm64, runner: ubuntu-24.04-arm }
          - { variant: glibc, arch: amd64, runner: ubuntu-24.04 }
          - { variant: glibc, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke test (io_uring denied / default seccomp, HTTP/1.1・2・3)
        id: smoke
        run: |
          digest="$(cat "digests/${{ matrix.variant }}-${{ matrix.arch }}")"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          docker pull "$IMAGE@$digest"
          tools/release/image-smoke.sh "$IMAGE@$digest" container
          # F-246: 設定を渡さずに起動して、内蔵のページを 8080 で返す
          tools/release/image-smoke.sh "$IMAGE@$digest" defaults
      # B-158: 公開する前にイメージの脆弱性を照合する。High 以上があれば、直す版の無いものでも公開しない
      - name: vulnerability scan (grype, High and above, including unfixed)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.smoke.outputs.ref }}
          severity-cutoff: high
          only-fixed: false
          output-format: table

  image-publish:
    name: image publish
    needs: [verify, image-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: create manifests, tag and sign
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: tools/release/publish-images.sh "$IMAGE" "$TAG" "$PRERELEASE" digests
      # F-248: Docker Hub へのコピーは、リリースのページを公開したとき（release-downstream.yml）に行う

  # ---------------------------------------------------------------------------
  # crates.io（F-238）
  # ---------------------------------------------------------------------------
  crates:
    name: crates.io
    needs: [verify, advisories]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm clang
      - id: auth
        if: needs.verify.outputs.prerelease == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish (dry-run on pre-releases)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            tools/release/publish-crates.sh --dry-run
          else
            tools/release/publish-crates.sh
          fi

  # ---------------------------------------------------------------------------
  # PyPI（F-238）
  # ---------------------------------------------------------------------------
  wheels:
    name: wheel ${{ matrix.name }}
    needs: [verify, advisories]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin, manylinux: "" }
          # macos-13 は GitHub が廃止した（ジョブが queued のまま始まらない）。Intel の macOS は macos-15-intel
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "" }
          - { name: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # quiche の BoringSSL（boring-sys）と aws-lc-sys は Windows の x86_64 のアセンブリに NASM を使う（windows-2022 の
      # イメージには入っていない）
      - name: install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # 試験の e2e.sh は h2c（--http2-prior-knowledge）を使う。Windows・Git for Windows の curl は HTTP/2 が無いので
          # curl.se のビルド（HTTP/2・HTTP/3 入り）を入れる（試験の手順で PATH の先頭に置く）
          choco install curl -y --no-progress
      - id: maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/veil-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          # aws-lc-sys の bindgen に libclang、quiche（Linux 以外の BoringSSL）に cmake が要る
          before-script-linux: |
            if command -v dnf >/dev/null; then dnf install -y clang-devel cmake perl-core || true;
            elif command -v apk >/dev/null; then apk add --no-cache clang-dev cmake perl || true;
            elif command -v apt-get >/dev/null; then apt-get update -y && apt-get install -y libclang-dev cmake || true; fi
      # 失敗したときは同じビルドをもう一度回し、出力の最後を注釈に出す（公開リポジトリの注釈はログイン無しで読める）
      - name: report the build error (macOS / Windows)
        if: failure() && steps.maturin.outcome == 'failure' && runner.os != 'Linux'
        shell: bash
        working-directory: crates/veil-python
        run: |
          python -m pip install -q "maturin>=1.5,<2.0"
          maturin build --release --target "${{ matrix.target }}" --out dist > "$RUNNER_TEMP/maturin.log" 2>&1 || true
          grep -E "error|Error|warning: .*failed|Caused by|thread .* panicked|could not find|not found" "$RUNNER_TEMP/maturin.log" | tail -40 \
            | while IFS= read -r l; do echo "::error title=maturin::${l:0:900}"; done
          tail -25 "$RUNNER_TEMP/maturin.log" | while IFS= read -r l; do echo "::warning title=maturin tail::${l:0:900}"; done
      - name: test the wheel on this runner
        shell: bash
        run: |
          case "${{ matrix.name }}" in musllinux-*) echo "skip: the runner is glibc"; exit 0;; esac
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          "$PY" -m pip install -q crates/veil-python/dist/*.whl pydantic
          # 単体（引数束縛・検証・OpenAPI）と、各サンプルを起動して curl で確かめる E2E
          case "$RUNNER_OS" in Windows) export PATH="/c/ProgramData/chocolatey/bin:$PATH";; esac
          set -o pipefail
          # 失敗した確認はログイン無しで読める注釈にも出す
          annotate() { grep -E "FAIL|Error|Traceback|error:" "$1" | tail -30 | while IFS= read -r l; do echo "::error title=wheel test::${l:0:900}"; done; }
          "$PY" crates/veil-python/tests/test_binding.py 2>&1 | tee "$RUNNER_TEMP/unit.log" || { annotate "$RUNNER_TEMP/unit.log"; exit 1; }
          PYTHON="$PY" PYTHON3="$PY" crates/veil-python/tests/e2e.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log" || { annotate "$RUNNER_TEMP/e2e.log"; exit 1; }
          # F-241: help() に出る __doc__ が英語だけで、チケット番号が無い
          PYTHON="$PY" tools/release/check-docs.sh --wheel 2>&1 | tee "$RUNNER_TEMP/docs.log" || { annotate "$RUNNER_TEMP/docs.log"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: crates/veil-python/dist/*.whl

  sdist:
    name: sdist
    needs: [verify, advisories]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/veil-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: crates/veil-python/dist/*.tar.gz

  # F-268: veil-api-kit（import veil_kit）。純 Python の wheel 1 個と sdist。版は veil-api と同じ（bump-version.sh）
  kit:
    name: veil-api-kit (wheel and sdist)
    needs: [verify, advisories]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build
        shell: bash
        run: |
          python -m pip install -q build
          python -m build crates/veil-python-kit --outdir crates/veil-python-kit/dist
          # 版と veil-api への依存の版が veil-api と同じ（maturin と同じ PEP 440 の綴り）
          python - <<'PY'
          import glob, re, tomllib
          kit = tomllib.load(open("crates/veil-python-kit/pyproject.toml", "rb"))["project"]
          ws = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          m = re.fullmatch(r"([0-9]+\.[0-9]+\.[0-9]+)(?:-([A-Za-z]+)\.?([0-9]*))?", ws)
          base, pre, n = m.groups()
          pep = base + ({"alpha": "a", "beta": "b", "rc": "rc"}.get(pre, ".dev") + (n or "0") if pre else "")
          assert kit["version"] == pep, (kit["version"], pep)
          assert "veil-api==%s" % pep in kit["dependencies"], kit["dependencies"]
          files = sorted(glob.glob("crates/veil-python-kit/dist/*"))
          assert len(files) == 2 and files[0].endswith(".tar.gz") and files[1].endswith("-py3-none-any.whl"), files
          print("veil-api-kit", pep, files)
          PY
      # 純 Python の部分（veil の拡張無しで動く試験）。docstring は英語でチケット番号が無い（F-241）
      - name: test
        shell: bash
        run: |
          python -m pip install -q crates/veil-python-kit/dist/*.whl --no-deps
          python -W error::SyntaxWarning -I crates/veil-python-kit/tests/test_kit.py
          python tools/lint/check-messages.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: crates/veil-python-kit/dist/*

  pypi:
    name: PyPI
    needs: [verify, wheels, sdist, kit]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: "{wheel-*,sdist,kit}"
      - name: publish to TestPyPI (pre-release)
        if: needs.verify.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          # rc の wheel の版は Cargo.toml の版（0.8.0）なので、2 回目以降の rc では既にある
          skip-existing: true
      - name: publish to PyPI
        if: needs.verify.outputs.prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # 途中で失敗した公開をやり直せるように（既にあるファイルは飛ばす）
          skip-existing: true
      # 失敗したときに、レジストリに載ったファイルと載っていないファイルを注釈に出す（ログはログイン無しで読めない）
      - name: report the uploaded files
        if: always()
        shell: bash
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          host=pypi.org; [ "$PRERELEASE" = true ] && host=test.pypi.org
          fail=0
          # F-268: veil-api と veil-api-kit（ファイル名の接頭辞 veil_api- と veil_api_kit- で分ける）
          for pkg in veil-api veil-api-kit; do
            norm="${pkg//-/_}"
            ver="$(ls dist/"$norm"-*.tar.gz | sed -E "s/.*${norm}-(.*)\.tar\.gz/\1/")"
            have="$(curl -s "https://$host/pypi/$pkg/$ver/json" | python3 -c 'import sys,json; print("\n".join(u["filename"] for u in json.load(sys.stdin)["urls"]))' 2>/dev/null || true)"
            # 公開の action が dist/ に置く *.publish.attestation は配布物ではないので数えない
            missing=""; n=0; for f in dist/"$norm"-*.whl dist/"$norm"-*.tar.gz; do n=$((n+1)); b="$(basename "$f")"; grep -qxF "$b" <<<"$have" || missing="$missing $b"; done
            if [ -n "$missing" ]; then echo "::error title=PyPI $pkg ($host $ver)::missing:$missing"; fail=1; continue; fi
            echo "::notice title=PyPI $pkg ($host $ver)::all $n files are on $host"
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # 各 OS の成果物と試験（F-247。dist.yml）
  # ---------------------------------------------------------------------------
  dist:
    needs: [verify, advisories]
    uses: ./.github/workflows/dist.yml
    with:
      ref: ${{ needs.verify.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Helm chart（F-254）: 公開したイメージで静的な検査と kind の試験を回し、ghcr.io の OCI に push して cosign で署名する。
  # rc は chart の版も rc（0.9.0-rc.1）にする（本番の 0.9.0 とぶつけない）。
  # ---------------------------------------------------------------------------
  helm:
    name: Helm chart
    needs: [verify, image-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: tools
        run: |
          tools/release/install-k8s-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install -q pyyaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: static checks (lint, kubeconform, veil -t of the rendered configurations)
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          docker pull -q "$IMAGE:musl-$TAG"
          tools/release/helm-check.sh "$IMAGE:musl-$TAG"
      - name: kind (install, helm test, TLS, HTTP/3, metrics, own configuration)
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: tools/release/helm-kind-test.sh "$IMAGE:musl-$TAG"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: package, push and sign
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm package deploy/helm/veil --version "$VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP/chart"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          out="$(helm push "$RUNNER_TEMP/chart/veil-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1)"
          echo "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          [ -n "$digest" ] || { echo "::error title=helm::no digest in the helm push output"; exit 1; }
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/veil@$digest"
          echo "::notice title=Helm chart::oci://ghcr.io/${{ github.repository_owner }}/charts/veil:$VERSION ($digest)"

  # ---------------------------------------------------------------------------
  # GitHub Release の draft（F-247）: 成果物・SHA256SUMS・署名・出自の証明・リリースノートを付ける。公開は人
  # ---------------------------------------------------------------------------
  release-draft:
    name: GitHub Release draft
    needs: [verify, dist, image-publish, helm, crates, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      # B-168: 公開済みのタグの run を（試験の job を確かめ直すために）再実行したときは、成果物・署名・出自の証明を
      # 作り直さずに成功で終える（公開していないものの署名・attestation を透明性ログに残さない）
      - name: release state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          s="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$s" = false ]; then
            echo "::notice title=GitHub Release::$TAG is already published; skipping the draft, checksums, signatures and attestations"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.state.outputs.published != 'true' }}
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true
      - name: BSD ports (the port directories to submit, F-253)
        if: ${{ steps.state.outputs.published != 'true' }}
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 tools/release/bsd-ports.py "$TAG" "$RUNNER_TEMP/ports"
          tar -C "$RUNNER_TEMP/ports" -czf "assets/veil-$VERSION-bsd-ports.tar.gz" freebsd openbsd netbsd
      - name: checksums
        if: ${{ steps.state.outputs.published != 'true' }}
        run: |
          cd assets
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ steps.state.outputs.published != 'true' }}
      - name: sign the checksums (Sigstore keyless)
        if: ${{ steps.state.outputs.published != 'true' }}
        run: cosign sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS
      - name: build provenance attestations
        if: ${{ steps.state.outputs.published != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ steps.state.outputs.published != 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release notes
        if: ${{ steps.state.outputs.published != 'true' }}
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          : > digests.txt
          for t in "musl-v$VERSION" "glibc-v$VERSION"; do
            d="$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest}}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["digest"])')"
            echo "$IMAGE:$t  $d" >> digests.txt
          done
          tools/release/release-notes.sh "$TAG" assets digests.txt > notes.md
          wc -c notes.md
      - name: create or update the draft
        if: ${{ steps.state.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: tools/release/github-draft.sh "$TAG" "Veil $VERSION" notes.md assets "$PRERELEASE"

