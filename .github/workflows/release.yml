# F-237 / F-238: タグ vX.Y.Z の push で、コンテナイメージ（ghcr.io）・Rust のクレート（crates.io）・
# Python の wheel（PyPI）を公開する。
#
# - 版はタグの版。タグ（v を除く）と Cargo.toml の [workspace.package] version が違えば何も公開しない（F-231）。
# - プレリリースのタグ（v0.8.0-rc.1 のように - を含む）では:
#     イメージ … 版のタグ（musl-v…・glibc-v…）だけを付け、latest・musl・glibc は動かさない
#     crates  … cargo publish --dry-run だけ（crates.io の公開は取り消せないため）
#     PyPI    … TestPyPI へ送る
# - 鍵は置かない: ghcr は GITHUB_TOKEN、crates.io と PyPI は trusted publishing（OIDC）。最初の 1 回だけ人が行う
#   準備は packaging/README.md の「公開（リリース）」の節。
# - 外部の action はコミットの SHA で固定する（F-236 の供給網の観点）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するタグ（例: v0.8.0-rc.1）。既に push 済みのもの"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/veil

jobs:
  verify:
    name: verify tag and version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: tools/release/verify-tag.sh "$TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # コンテナイメージ（F-237）
  # ---------------------------------------------------------------------------
  image:
    name: image ${{ matrix.variant }}/${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { variant: musl, arch: amd64, file: docker/Dockerfile.musl }
          - { variant: musl, arch: arm64, file: docker/Dockerfile.musl.aarch64 }
          - { variant: glibc, arch: amd64, file: docker/Dockerfile.glibc }
          - { variant: glibc, arch: arm64, file: docker/Dockerfile.glibc.aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          # aarch64 の Dockerfile は x86_64 のビルダーでクロスビルドし、最後の段だけ arm64 にする
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_FEATURES=full
            CARGO_FEATURES_FALLBACK=full-container
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0 OR MIT
            org.opencontainers.image.description=veil reverse proxy (${{ matrix.variant }}; /veil = io_uring, /veil.epoll = epoll fallback)
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.variant }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 7

  image-test:
    name: image test ${{ matrix.variant }}/${{ matrix.arch }}
    needs: [verify, image]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: musl, arch: amd64, runner: ubuntu-24.04 }
          - { variant: musl, arch: arm64, runner: ubuntu-24.04-arm }
          - { variant: glibc, arch: amd64, runner: ubuntu-24.04 }
          - { variant: glibc, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke test (default seccomp → epoll, unconfined → io_uring, HTTP/1.1・2・3)
        run: |
          digest="$(cat "digests/${{ matrix.variant }}-${{ matrix.arch }}")"
          docker pull "$IMAGE@$digest"
          tools/release/image-smoke.sh "$IMAGE@$digest" auto

  image-publish:
    name: image publish
    needs: [verify, image-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: create manifests, tag and sign
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: tools/release/publish-images.sh "$IMAGE" "$TAG" "$PRERELEASE" digests
      - name: copy to Docker Hub (only when the secrets exist)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          tools/release/publish-images.sh "docker.io/$DOCKERHUB_USERNAME/veil" "$TAG" "$PRERELEASE" digests "$IMAGE"

  # ---------------------------------------------------------------------------
  # crates.io（F-238）
  # ---------------------------------------------------------------------------
  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm clang
      - id: auth
        if: needs.verify.outputs.prerelease == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish (dry-run on pre-releases)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            tools/release/publish-crates.sh --dry-run
          else
            tools/release/publish-crates.sh
          fi

  # ---------------------------------------------------------------------------
  # PyPI（F-238）
  # ---------------------------------------------------------------------------
  wheels:
    name: wheel ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin, manylinux: "" }
          # macos-13 は GitHub が廃止した（ジョブが queued のまま始まらない）。Intel の macOS は macos-15-intel
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "" }
          - { name: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # quiche の BoringSSL（boring-sys）と aws-lc-sys は Windows の x86_64 のアセンブリに NASM を使う（windows-2022 の
      # イメージには入っていない）
      - name: install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - id: maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/veil-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          # aws-lc-sys の bindgen に libclang、quiche（Linux 以外の BoringSSL）に cmake が要る
          before-script-linux: |
            if command -v dnf >/dev/null; then dnf install -y clang-devel cmake perl-core || true;
            elif command -v apk >/dev/null; then apk add --no-cache clang-dev cmake perl || true;
            elif command -v apt-get >/dev/null; then apt-get update -y && apt-get install -y libclang-dev cmake || true; fi
      # 失敗したときは同じビルドをもう一度回し、出力の最後を注釈に出す（公開リポジトリの注釈はログイン無しで読める）
      - name: report the build error (macOS / Windows)
        if: failure() && steps.maturin.outcome == 'failure' && runner.os != 'Linux'
        shell: bash
        working-directory: crates/veil-python
        run: |
          python -m pip install -q "maturin>=1.5,<2.0"
          maturin build --release --target "${{ matrix.target }}" --out dist > "$RUNNER_TEMP/maturin.log" 2>&1 || true
          grep -E "error|Error|warning: .*failed|Caused by|thread .* panicked|could not find|not found" "$RUNNER_TEMP/maturin.log" | tail -40 \
            | while IFS= read -r l; do echo "::error title=maturin::${l:0:900}"; done
          tail -25 "$RUNNER_TEMP/maturin.log" | while IFS= read -r l; do echo "::warning title=maturin tail::${l:0:900}"; done
      - name: test the wheel on this runner
        shell: bash
        run: |
          case "${{ matrix.name }}" in musllinux-*) echo "skip: the runner is glibc"; exit 0;; esac
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          "$PY" -m pip install -q crates/veil-python/dist/*.whl pydantic
          # 単体（引数束縛・検証・OpenAPI）と、各サンプルを起動して curl で確かめる E2E
          "$PY" crates/veil-python/tests/test_binding.py
          PYTHON="$PY" PYTHON3="$PY" crates/veil-python/tests/e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: crates/veil-python/dist/*.whl

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/veil-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: crates/veil-python/dist/*.tar.gz

  pypi:
    name: PyPI
    needs: [verify, wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: "{wheel-*,sdist}"
      - name: publish to TestPyPI (pre-release)
        if: needs.verify.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: publish to PyPI
        if: needs.verify.outputs.prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
