# F-57: PR / push ゲート CI
#
# fmt / clippy / feature マトリクスビルド / ユニット・統合・E2E テストを実行する。
# データプレーンは Linux/io_uring 前提のため ubuntu ランナーで実行する。
# コンテナ必須のフルセキュリティスイート（fuzz/chaos/scan）は nightly（別 workflow）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチの古い実行はキャンセルして無駄なランナー消費を避ける。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ネットワーク不要なオフラインビルドで再現性を高める。
  CARGO_NET_RETRY: "3"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # F-242: ログ・エラー・panic の文字列は英語で、チケット番号を入れない（テストとコメントは対象外）。
  messages:
    name: messages (English, no ticket IDs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lint/test_check_messages.py
      - run: python3 tools/lint/check-messages.py
      # B-208: 公開の状態の判定（API の失敗を「無い」と見なさない）
      - run: tools/release/release-state.sh --self-test

  clippy:
    name: clippy (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # AGENTS.md: allow(dead_code) 禁止・論拠なき allow 追加禁止。警告ゼロを維持しているため
      # -D warnings でゲートする。clippy.toml の disallowed-methods（ホットパスのブロッキング検出、
      # F-88）もここで効く。reactor（epoll）は io_uring ビルドでは 1 行もコンパイルされないため両方回す。
      - run: cargo clippy --all-targets --features full -- -D warnings
      - run: cargo clippy --all-targets --features full,epoll -- -D warnings

  # F-239: docs.rs と同じ構成（full + api）で API 文書をビルドし、壊れたリンクと doctest の失敗を検出する。
  docs:
    name: docs (full,api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --no-default-features --features full,api
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo test --doc --no-default-features --features full,api
      # F-241: docs.rs に出る文書（と Python の文書）が英語だけで、チケット番号が無い
      - uses: dtolnay/rust-toolchain@nightly
      - run: tools/release/check-docs.sh

  build:
    name: build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "--no-default-features"
          - features: "" # default features
          - features: "--features full"
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build ${{ matrix.features }}

  test:
    name: unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (lib, full)
        run: cargo test --lib --features full
      - name: Integration tests (full)
        run: cargo test --test integration_tests --features full
      - name: Routing property tests
        run: cargo test --test routing_proptest --features full
      # F-247 / F-255 / F-256: 既定の設定の雛形・文書の中の設定例・ダッシュボードの JSON を、このコミットの veil で検査する
      - name: Default configurations, guide examples and the Grafana dashboard
        run: |
          cargo build --features full
          tools/release/render-defaults.sh --check "$PWD/target/debug/veil"
          python3 tools/lint/check-guide-configs.py target/debug/veil \
            docs/guide/migration-nginx.md docs/guide/ja/migration-nginx.md \
            docs/guide/migration-envoy.md docs/guide/ja/migration-envoy.md
          python3 tools/grafana/gen_dashboard.py --check

  e2e:
    name: e2e (features full)
    # E2E はローカルで ./tests/e2e_setup.sh test を運用しているため、この workflow では
    # 実行しない（コンテナ/ネットワーク前提の重いセットアップで CI ランナーに不向き）。
    # 再有効化する場合はこの if 行を削除する。
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # E2E は専用バックエンドを自動セットアップ・実行・クリーンアップする。
      - name: Run E2E suite
        run: ./tests/e2e_setup.sh test

  python-docs:
    name: python docs + stubs (F-239)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Read the Docs と同じ設定で警告をエラーにしてビルドする（Rust の拡張はコンパイルしない）。
      - name: Build the Sphinx docs (warnings are errors)
        run: |
          pip install -r crates/veil-python/docs/requirements.txt
          sphinx-build -W -b html crates/veil-python/docs _build
      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # wheel をビルドして入れ、_veil.pyi と実物のずれを stubtest で検出する。
      - name: Build the wheel
        run: |
          pip install maturin
          cd crates/veil-python && maturin build --release -o dist
      - name: stubtest (veil._veil.pyi vs the built extension)
        run: |
          pip install mypy crates/veil-python/dist/*.whl
          if [ -f crates/veil-python/stubtest-allowlist.txt ]; then
            python -m mypy.stubtest veil._veil --allowlist crates/veil-python/stubtest-allowlist.txt
          else
            python -m mypy.stubtest veil._veil
          fi
