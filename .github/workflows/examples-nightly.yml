# F-255 / F-256: 移行ガイドの等価性の試験（nginx・Envoy と veil に同じ要求を送って比べる）と、Grafana のダッシュボードの試験
# （compose を立ち上げて全パネルの式を問い合わせる）。このコミットの veil のイメージで回す。
# F-264: ライブラリの /docs の Swagger UI のオフラインの試験（swagger-offline）。
name: examples-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/grafana/**"
      - "tests/migration/**"
      - "tools/grafana/**"
      - "docs/guide/migration-*.md"
      - "third_party/swagger-ui-dist/**"
      - "src/api/swagger_ui.rs"
      - "tests/api/swagger_offline.*"

permissions:
  contents: read

concurrency:
  group: examples-nightly
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the image of this commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.musl
          build-args: CARGO_FEATURES=full-container
          tags: veil:nightly
          load: true
          cache-from: type=gha,scope=musl-amd64
      - name: migration equivalence (nginx, Envoy)
        run: tests/migration/run.sh veil:nightly
      - name: Grafana dashboard
        run: tools/grafana/test-dashboard.sh veil:nightly

  # F-264: ライブラリの /docs（同梱の Swagger UI）が、ネットワークの無いコンテナの中のヘッドレスの Chromium で
  # 外へ通信せずに描画される（Rust・Python）
  swagger-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install build deps
        run: sudo apt-get update -y && sudo apt-get install -y cmake nasm clang
      - uses: dtolnay/rust-toolchain@stable
      - name: Swagger UI offline (Playwright, --network none)
        run: tests/api/swagger_offline.sh all
