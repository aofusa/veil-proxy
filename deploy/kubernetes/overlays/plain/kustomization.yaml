# メッシュ無し（比較用）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: veil-plain
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: {kind: Deployment, name: veil-app}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value: {name: VEIL_OVERRIDE_3, value: "vds.enabled = true"}
