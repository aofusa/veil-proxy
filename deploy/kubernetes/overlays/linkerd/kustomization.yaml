# Linkerd のプロキシ注入（linkerd.io/inject=enabled）。Linkerd は既定でメッシュ内を mTLS にする。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: veil-linkerd
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: {kind: Deployment, name: veil-app}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value: {name: VEIL_OVERRIDE_3, value: "vds.enabled = true"}
