# VDS の参照制御プレーン（tools/vds/server、gRPC + REST。イメージは docker/Dockerfile.vds-server）。
# スナップショットは ConfigMap（veil-vds-snapshot）。veil は gRPC の双方向ストリームで購読する（F-199）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veil-vds
  labels: {app: veil-vds}
spec:
  replicas: 1
  selector:
    matchLabels: {app: veil-vds}
  template:
    metadata:
      labels: {app: veil-vds}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vds
          image: veil-vds-server:latest
          imagePullPolicy: IfNotPresent
          args: ["--snapshot", "/etc/vds/snapshot.toml", "--listen", "0.0.0.0:18000",
                 "--token-file", "/etc/veil/vds/token", "--hold", "20"]
          ports:
            - {name: vds, containerPort: 18000}
          readinessProbe:
            httpGet: {path: /healthz, port: vds}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: snapshot, mountPath: /etc/vds, readOnly: true}
            - {name: vds-token, mountPath: /etc/veil/vds, readOnly: true}
      volumes:
        - name: snapshot
          configMap: {name: veil-vds-snapshot}
        - name: vds-token
          secret: {secretName: veil-vds-token}
---
apiVersion: v1
kind: Service
metadata:
  name: veil-vds
spec:
  selector: {app: veil-vds}
  ports:
    # gRPC（h2c）と REST を同じポートで。Istio は名前の grpc- 接頭辞で gRPC と扱い、Linkerd は HTTP/2 を自動判別する
    # （appProtocol: http を付けると Linkerd は HTTP/1.1 に固定して h2c を壊す）
    - {name: grpc-vds, port: 18000, targetPort: vds}
