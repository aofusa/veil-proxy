{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veil.fullname" . }}
  labels:
    {{- include "veil.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veil.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        {{- if .Values.tls.secretName }}
        - port: 8443
          protocol: TCP
        {{- end }}
        {{- if .Values.http3.enabled }}
        - port: 8443
          protocol: UDP
        {{- end }}
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
