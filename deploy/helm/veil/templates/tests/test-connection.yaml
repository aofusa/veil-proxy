apiVersion: v1
kind: Pod
metadata:
  name: {{ include "veil.fullname" . }}-test
  labels:
    {{- include "veil.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS -o /dev/null http://{{ include "veil.fullname" . }}:{{ .Values.service.port }}/ &&
          curl -fsS --http2-prior-knowledge -o /dev/null http://{{ include "veil.fullname" . }}:{{ .Values.service.port }}/ &&
          echo ok
