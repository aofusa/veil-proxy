{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.allowedIps }}
{{- fail "metrics.serviceMonitor.enabled needs metrics.allowedIps: list the addresses of the Prometheus pods (your pod CIDR, for example 10.244.0.0/16). The empty default allows loopback only. Do not list node, load balancer or ingress addresses." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "veil.fullname" . }}
  labels:
    {{- include "veil.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "veil.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /__metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
