# The CI of aofusa/homebrew-tap (copied there by veil-proxy's tools/release/homebrew-publish.sh; edit it in
# veil-proxy's packaging/homebrew/tap-test.yml).
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: install, test, audit
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || true)"; fi
          if ! command -v brew >/dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap aofusa/tap "https://github.com/${GITHUB_REPOSITORY}"
          brew install aofusa/tap/veil
          brew test aofusa/tap/veil
          brew audit --strict --online aofusa/tap/veil
          for i in $(seq 1 3); do veil --version && break; done
