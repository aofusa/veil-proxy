# http3/quiche 向け AWS_LC_SYS_NO_PREFIX のターゲットトリプル別設定（B-47 / F-131）
#
# 背景:
#   `http3` フィーチャーは quiche を使う。quiche の暗号バックエンドはターゲットで異なる
#   （Cargo.toml の target 別依存を参照）:
#     - linux                   : quiche(default-features=false) が rustls(aws-lc-rs) と
#                                同一の aws-lc-sys を共有する。quiche は BoringSSL 互換の
#                                **非プレフィックス**シンボルを要求するため NO_PREFIX=1。
#     - freebsd / windows / macos: quiche(boringssl-boring-crate) が外部 `boring` crate
#                                （BoringSSL）を持つ。aws-lc-rs と共存させるには aws-lc-sys
#                                側のシンボルを**プレフィックスしたまま**にする必要がある
#                                ため NO_PREFIX=0（0 のままにしないと BoringSSL とシンボルが
#                                衝突する）。FreeBSD は F-136 で aws-lc-sys 共有からこちらへ
#                                切り替えた（証明書ホットリロードの in-memory SSL_CTX API が
#                                boringssl-boring-crate 限定のため。B-47 の失敗モードと同じ
#                                重複シンボルを避ける）。
#     - openbsd / netbsd        : rustls は ring、quiche は boringssl-boring-crate。aws-lc-sys は
#                                依存グラフに現れないが、一貫性のため NO_PREFIX=0 とする
#                                （NetBSD は F-140 で OpenBSD と同じ扱いに揃えた）。
#
# なぜ `[env]` にターゲット接尾辞付きの変数名を並べるのか:
#   cargo には**ターゲット別の環境変数設定が存在しない**。`[target.<triple>.env]` は
#   cargo が認識しないキーであり、**警告もなく黙って無視される**（実際にこれが原因で
#   クロスビルドが失敗していた）。一方 aws-lc-sys のビルドスクリプトは
#   `AWS_LC_SYS_<NAME>_<target_with_underscores>` 形式のターゲット別変数を
#   非接尾辞版より優先して読む（aws-lc-sys builder/main.rs の
#   `optional_env_crate_target` / `env_name_for_target`）。
#   そこで cargo のグローバル `[env]` にターゲット接尾辞付きの名前を列挙することで、
#   ビルド方法（ローカル cargo / cargo zigbuild / cargo xwin / Docker / QEMU VM 内）に
#   依らず、`--target` で選ばれたトリプルに応じた値が確実に渡るようにする。
#
#   接尾辞はトリプルの `-` を `_` に置換したもの。値 "1"/"0" は aws-lc-sys の
#   `parse_to_bool`（先頭文字 0/n/off/f を false、数字/y/on/t を true）で解釈される。
#
# 非接尾辞の `AWS_LC_SYS_NO_PREFIX` は**意図的に定義しない**。定義すると全ターゲットへ
# 一律に適用され、ターゲット別の値と食い違ったときに原因が分かりにくくなるため。
#
# `force = true` にしている理由:
#   (1) シェルに古い `AWS_LC_SYS_NO_PREFIX_*` が残っていてもターゲットに対して
#       正しい値が必ず勝つようにする（B-47 の失敗モードそのものを防ぐ）。
#   (2) 子ワークスペース（tests/test_backends・tests/grpc_server）の
#       `.cargo/config.toml` が同じキーを**テーブル形式**で上書きするため、
#       親も同じ形式にしておかないと cargo が
#       「expected table, but found string」でマージに失敗する。

[env]
# --- Linux: quiche と aws-lc-rs で aws-lc-sys を共有する（非プレフィックス） ---
AWS_LC_SYS_NO_PREFIX_x86_64_unknown_linux_gnu = { value = "1", force = true }
AWS_LC_SYS_NO_PREFIX_x86_64_unknown_linux_musl = { value = "1", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_unknown_linux_gnu = { value = "1", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_unknown_linux_musl = { value = "1", force = true }

# --- FreeBSD: F-136 で quiche を boringssl-boring-crate へ切替、aws-lc-sys 共有をやめた。
#     証明書ホットリロードを capsicum capability mode 下でも動かすため quiche の
#     in-memory SSL_CTX API（`with_boring_ssl_ctx_builder`）を使う必要があり、これは
#     外部 `boring` crate 経由でのみ提供される。aws-lc-sys（NO_PREFIX=1）と BoringSSL を
#     同一バイナリに同居させるとリンク時に重複シンボルエラーになる（実験で確認済み、
#     docs/artifacts/f136_platform_design.md 参照）ため、Windows/macOS/OpenBSD と同じ
#     NO_PREFIX=0（プレフィックス維持で共存）に変更する。
AWS_LC_SYS_NO_PREFIX_x86_64_unknown_freebsd = { value = "0", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_unknown_freebsd = { value = "0", force = true }

# --- Windows: quiche は内蔵 BoringSSL。aws-lc-sys はプレフィックス維持で共存 ---
AWS_LC_SYS_NO_PREFIX_x86_64_pc_windows_msvc = { value = "0", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_pc_windows_msvc = { value = "0", force = true }

# --- macOS: quiche は内蔵 BoringSSL。universal2 は x86_64/aarch64 個別にビルドされる ---
AWS_LC_SYS_NO_PREFIX_x86_64_apple_darwin = { value = "0", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_apple_darwin = { value = "0", force = true }

# --- OpenBSD: rustls=ring / quiche=内蔵 BoringSSL（aws-lc-sys は非依存） ---
AWS_LC_SYS_NO_PREFIX_x86_64_unknown_openbsd = { value = "0", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_unknown_openbsd = { value = "0", force = true }

# --- NetBSD: OpenBSD と同じ扱い（rustls=ring / quiche=boringssl-boring-crate、
#     aws-lc-sys は非依存。F-140） ---
AWS_LC_SYS_NO_PREFIX_x86_64_unknown_netbsd = { value = "0", force = true }
AWS_LC_SYS_NO_PREFIX_aarch64_unknown_netbsd = { value = "0", force = true }
