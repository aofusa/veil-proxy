[package]
edition = "2021"
rust-version = "1.85"
# veil: 公開名と版（F-238。`[lib] name = "quiche"` はそのまま）
name = "veil-proxy-quiche"
version = "0.24.9-veil.4"
authors = ["Alessandro Ghedini <alessandro@ghedini.me>"]
build = "src/build.rs"
include = [
    "/*.md",
    "/*.toml",
    "/COPYING",
    "/deps/boringssl/**/*.[chS]",
    "/deps/boringssl/**/*.asm",
    "/deps/boringssl/src/**/*.cc",
    "/deps/boringssl/**/CMakeLists.txt",
    "/deps/boringssl/**/sources.cmake",
    "/deps/boringssl/LICENSE",
    "/examples",
    "/include",
    "/quiche.svg",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "quiche 0.24.9 (Cloudflare) vendored for veil-proxy: always coalesces STREAM frames into one packet (see README.veil.md)"
readme = "README.md"
keywords = [
    "quic",
    "http3",
]
categories = ["network-programming"]
license = "BSD-2-Clause"
repository = "https://github.com/aofusa/veil-proxy"
homepage = "https://github.com/cloudflare/quiche"

[package.metadata.release]
tag-prefix = ""

[package.metadata.docs.rs]
no-default-features = true
features = [
    "boringssl-boring-crate",
    "qlog",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
# veil: BoringSSL の API を aws-lc-sys の Rust のバインディング経由で呼ぶ（README.veil.md の 5、F-243）。
# aws-lc-sys のシンボルの接頭辞の有無（AWS_LC_SYS_NO_PREFIX）を問わずリンクできる。
aws-lc-sys = ["dep:aws-lc-sys"]
boringssl-boring-crate = [
    "boring",
    "foreign-types-shared",
]
boringssl-vendored = []
# veil: deps/boringssl を取り込んでいないので既定では有効にしない（veil は使わない）
default = []
ffi = ["dep:cdylib-link-lines"]
fuzzing = []
gcongestion = []
internal = []
openssl = ["pkg-config"]
pkg-config-meta = []

[lib]
name = "quiche"
# veil: rlib だけを作る（upstream は C FFI 用に staticlib・cdylib も作る。README.veil.md）
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies.aws-lc-sys]
# veil 本体（Cargo.toml の Linux の依存）と同じ範囲・同じ feature（links があるので必ず 1 つの版になる）
version = ">=0.45, <0.48"
features = ["ssl", "bindgen"]
optional = true

[dependencies.boring]
version = "4.3"
optional = true

[dependencies.either]
version = "1.8"
default-features = false

[dependencies.enum_dispatch]
version = "0.3"

[dependencies.foreign-types-shared]
version = "0.3.0"
optional = true

[dependencies.intrusive-collections]
version = "0.9.5"

[dependencies.libc]
version = "0.2.76"
default-features = false

[dependencies.libm]
version = "0.2"

[dependencies.log]
version = "0.4.20"
features = ["std"]

[dependencies.octets]
version = "0.3.6"
features = ["huffman_hpack"]

[dependencies.qlog]
version = "0.15.2"
optional = true

[dependencies.sfv]
version = "0.9"
optional = true

[dependencies.slab]
version = "0.4"

[dependencies.smallvec]
version = "1.10"
features = ["union"]
default-features = false

[dev-dependencies.mio]
version = "1"
features = [
    "net",
    "os-poll",
]

[dev-dependencies.ring]
version = "0.17.8"

[dev-dependencies.rstest]
version = "0.26.1"

[dev-dependencies.url]
version = "2"

[build-dependencies.cdylib-link-lines]
version = "0.1"
optional = true

[build-dependencies.cmake]
version = "0.1"

[build-dependencies.pkg-config]
version = "0.3"
optional = true

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
]

# veil: 第三者のコードなので veil の clippy（`-D warnings`）の対象にしない。F-238 で `[patch]` から
# 名前を変えた path 依存にしたため、cargo がローカルのパッケージとして lint するようになった。
[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[lints.rust]
warnings = { level = "allow", priority = -1 }
