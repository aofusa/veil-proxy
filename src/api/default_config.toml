# Default configuration of the veil API library.
#
# The server starts with this configuration when there is no config.toml. A config.toml is deep-merged over it,
# and Rust code (`Config::builder()`) and `VEIL_OVERRIDE_<n>` environment variables override both.
# By default there is no TLS: plaintext HTTP/1.1 and h2c (prior knowledge) on 127.0.0.1:8080
# (`[server].listen_cleartext`; add `[server].listen` and `[tls]` for TLS).
# The thread count (server.threads) is set to the number of CPUs at startup.

[server]
# Plaintext listener (HTTP/1.1 + h2c). There is no TLS listener (listen) by default.
# Loopback only, so the server is not reachable from other hosts; set "0.0.0.0:8080" or similar to expose it.
listen_cleartext = "127.0.0.1:8080"
# No TLS listener, so do not redirect to https (serve plaintext).
enable_secure_redirect = false
http2_enabled = true

[logging]
level = "info"

# Access log: written to standard output as text (the proxy binary's default is off).
# Turn it off with `[access_log] enabled = false` in config.toml, `VEIL_OVERRIDE_<n>="access_log.enabled=false"`
# or `Config::builder().set("access_log.enabled=false")`. Lines are flushed every flush_interval_ms (default 1000).
[access_log]
enabled = true
format = "text"

[security]
# Off by default so that the host language (Python, C) and your code are not restricted.
enable_seccomp = false
enable_landlock = false

[api]
openapi_enabled = true
openapi_path = "/docs"
openapi_json_path = "/openapi.json"
openapi_title = "veil API"
openapi_version = "0.1.0"
