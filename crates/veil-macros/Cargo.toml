[package]
name = "veil-proxy-macros"
version.workspace = true
edition.workspace = true
description = "Procedural macros for the veil API server library (#[veil::route], #[veil::main], #[derive(veil::Schema)])"
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "veil_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
