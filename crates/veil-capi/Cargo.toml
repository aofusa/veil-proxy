[package]
name = "veil-capi"
version.workspace = true
edition.workspace = true
description = "C API for the veil API server library (libveil.so / libveil.a + veil.h)"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "veil"
crate-type = ["cdylib", "staticlib"]

# 機能セットはコンテナ向けと同じ（Linux は epoll の readiness reactor）+ API 基盤。
# ライブラリはホストプロセスのアロケータを置き換えない（veil-alloc / mimalloc を含めない）。
[dependencies]
veil = { path = "../..", default-features = false, features = [
    "ktls", "http2", "http3", "compression", "cache", "metrics", "websocket",
    "rate-limit", "buffering", "admin", "access-log", "l4-proxy",
    "handler", "openapi", "macro", "grpc-handler", "l4-handler",
] }
bytes = "1"
serde_json = "1"

# epoll feature は Linux でだけ指定できる（他の OS は kqueue / WSAPoll の reactor が自動で選ばれ、
# 指定すると veil の build.rs がエラーにする）。
[target.'cfg(target_os = "linux")'.dependencies]
veil = { path = "../..", default-features = false, features = ["epoll"] }
