# cargo-deny 設定（container_security / CI 向け最小構成）

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# cargo-deny 0.18 以降、`unmaintained` は重大度（"warn" 等）ではなく
# **対象範囲**（"all" | "workspace" | "transitive" | "none"）を取る。
# 旧来の `unmaintained = "warn"` は
#   error[unexpected-value]: expected '["all", "workspace", "transitive", "none"]'
# で設定のデシリアライズごと失敗し、cargo-deny が一度も動かなくなる。
#
# "all" にして、間接依存の unmaintained 化も失敗にする（B-158。以前は "workspace" で、wasmtime 経由の
# fxhash のような間接依存を見逃していた）。やむを得ず残すものは `ignore` に理由付きで書く。
unmaintained = "all"
# `notice` は advisories 設定 version 2 で廃止された（重大度の個別指定は不可）。

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    # xxhash-rust。OSI 承認・FSF Free/Libre のパーミッシブライセンス。
    "BSL-1.0",
    # webpki-roots（Mozilla の CA バンドル）。データ向けのパーミッシブライセンス。
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"