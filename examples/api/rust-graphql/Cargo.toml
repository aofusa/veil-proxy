# veil の API ライブラリで GraphQL を使うサンプル（F-207）。veil は GraphQL のライブラリに依存しないので、
# 好きな実装（ここでは async-graphql）をハンドラとして載せる。src/graphql.rs がその橋渡し（コピーして使える）。
#
#   cargo run --release                    # 平文 127.0.0.1:8080（VEIL_LISTEN で変更）
#   curl -X POST localhost:8080/graphql -H 'content-type: application/json' -d '{"query":"{ add(a:1,b:2) }"}'
#   open http://localhost:8080/graphql     # GraphiQL
[package]
name = "veil-example-graphql"
version = "0.1.0"
edition = "2021"
publish = false

# veil 本体のワークスペースとは独立させる（`[[example]]` を本体に足すとコンテナビルドが壊れるため）。
[workspace]

[dependencies]
# 実際に使うときは git 依存:
# veil = { git = "https://github.com/aofusa/veil-proxy", default-features = false, features = ["full", "api"] }
veil = { package = "veil-proxy", path = "../../..", default-features = false, features = ["full", "api"] }
async-graphql = { version = "7", default-features = false, features = ["graphiql"] }
serde_json = "1"
futures = "0.3"
bytes = "1"

# veil 本体と同じ vendoring 版 quiche を使う（F-172）。
