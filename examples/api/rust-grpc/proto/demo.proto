// veil の gRPC サーバのサンプル（F-197）。単項・サーバ/クライアント/双方向ストリーミング・期限・エラーを含む。
syntax = "proto3";
package demo.v1;

service Demo {
  // 単項: 挨拶を返す（大きなメッセージの往復にも使う）
  rpc SayHello(HelloRequest) returns (HelloReply);
  // サーバストリーミング: 1..=count を返す
  rpc CountUp(CountRequest) returns (stream CountReply);
  // クライアントストリーミング: 受け取った数の合計
  rpc Sum(stream Number) returns (SumReply);
  // 双方向: 受け取った文を大文字にして返す
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
  // 指定ミリ秒待つ（grpc-timeout の試験）
  rpc Sleep(SleepRequest) returns (Empty);
  // 指定のステータスで失敗する
  rpc Fail(FailRequest) returns (Empty);
}

message HelloRequest { string name = 1; }
message HelloReply { string message = 1; }
message CountRequest { uint32 count = 1; }
message CountReply { uint32 n = 1; }
message Number { int64 value = 1; }
message SumReply { int64 total = 1; uint32 count = 2; }
message ChatMessage { string text = 1; }
message SleepRequest { uint32 millis = 1; }
message FailRequest { int32 code = 1; string message = 2; }
message Empty {}
