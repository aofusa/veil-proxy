# 最小のライブラリ利用例（README のクイックスタートと同じコード）。
#   cargo run   → 平文 HTTP/1.1 + h2c を 127.0.0.1:8080、OpenAPI は /docs
[package]
name = "veil-example-hello"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
veil = { package = "veil-proxy", path = "../../..", default-features = false, features = ["full", "api"] }
serde_json = "1"

[patch.crates-io]
quiche = { path = "../../../third_party/quiche" }
