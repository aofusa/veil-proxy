# Docker secrets で証明書・秘密鍵を渡す例（F-180）。
#
#   ./gen-cert.sh                 # secrets/cert.pem, secrets/key.pem を作る（自己署名）
#   docker compose -f compose.secrets.yaml up -d
#   curl -k https://localhost:8443/
#
# 証明書を更新するときは secrets/ のファイルを置き換える（veil が auto_reload で検知）。
# 設定値の差し替えは VEIL_OVERRIDE_<n>（F-179）で行い、設定ファイルを書き換えずに済む。
services:
  veil:
    image: ${VEIL_IMAGE:-veil:musl}
    command: ["/veil", "-c", "/etc/veil/conf.d/config.toml"]
    ports:
      - "8443:8443"
    environment:
      # 例: スレッド数とログレベルを環境変数で上書き（秘密値は入れない）
      VEIL_OVERRIDE_1: "server.threads = 2"
      VEIL_OVERRIDE_2: 'logging.level = "info"'
    secrets:
      - tls_cert
      - tls_key
    volumes:
      - ./config.toml:/etc/veil/conf.d/config.toml:ro
      - ./www:/var/www:ro
    stop_grace_period: 15s

secrets:
  tls_cert:
    file: ./secrets/cert.pem
  tls_key:
    file: ./secrets/key.pem
